<html>
<head>
<meta charset="utf-8">
<title>NOVROS</title>
<style>
:root {
  --c0: 0,229,255;
  --c2: 2,10,10;
  --c3: 2,14,12;
  --c4: 3,18,16;
  --c5: 3,33,29;
  --c6: 4,25,28;
  --c7: 4,26,24;
  --c8: 5,34,39;
  --c9: 10,40,36;
  --c10: 14,40,36;
  --c11: 16,44,40;
  --c12: 18,48,44;
  --c13: 18,60,54;
  --c14: 20,72,79;
  --c15: 30,70,64;
  --c16: 52,108,100;
  --c17: 58,116,108;
  --c18: 60,120,112;
  --c19: 70,140,130;
  --c20: 107,156,150;
  --c21: 111,227,201;
  --c22: 111,229,214;
  --c23: 127,179,171;
  --c24: 140,225,212;
  --c25: 140,240,225;
  --c26: 143,240,228;
  --c27: 150,255,236;
  --c28: 159,240,221;
  --c29: 160,240,226;
  --c30: 160,255,240;
  --c31: 168,216,207;
  --c32: 180,255,245;
  --c33: 191,255,245;
  --c34: 200,245,236;
  --c35: 210,255,248;
  --c36: 220,245,238;
  --c37: 223,243,238;
  --c38: 228,250,252;
  --c39: 230,255,240;
  --c40: 234,255,251;
  --c41: 235,250,250;
  --c42: 236,255,250;
}

  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
               background:#000; font-family:-apple-system,"SF Pro Display",sans-serif; }
  body.overlay { background:transparent; }
  body.keybg { /* background color set by JS from ?key= (default magenta) */ }
  /* green-key fallback: the UI can't be green on a green key (learned live
     2026-08-07 — the cursor got keyed out of existence). Cyan takes over. */
  body.ui-cyan .cursor { border-color:rgba(var(--c0),0.9); background:rgba(var(--c0),0.12); }
  body.ui-cyan .cursor.pinched { background:rgba(var(--c0),0.85); box-shadow:0 0 18px rgba(var(--c0),0.8); }
  body.ui-cyan .cursor .dwell { background:conic-gradient(rgb(var(--c0)) calc(var(--p)*360deg), transparent 0); }
  body.ui-cyan .card, body.ui-cyan .panel { border-color:rgba(var(--c0),0.5); }
  body.ui-cyan .card h3, body.ui-cyan .panel .bar h3, body.ui-cyan .panel .close
    { color:rgb(var(--c0)); border-color:rgba(var(--c0),0.6); }
  body.ui-cyan .scroll .h { color:rgb(var(--c0)); }
  #toast { position:absolute; top:14px; right:14px; z-index:998; display:none;
           background:rgba(0,0,0,0.7); color:rgb(var(--c26)); padding:8px 14px;
           border-radius:8px; font:13px "SF Mono",Menlo,monospace; }
  /* the squeeze-hold charge glow, visible on the TRACKER too (the render
     page has its own on-air rule): pinch + hold still = charge = open/close */
  .card, .panel { --ch:0; }
  body:not(.on-air) .card.grabbed, body:not(.on-air) .panel.grabbed {
    box-shadow:0 12px 60px rgba(0,0,0,0.7),
      0 0 calc(44px + var(--ch)*70px) rgba(var(--c22),calc(0.35 + var(--ch)*0.55)); }
  /* THE PRESENT spotlight: one item center stage, the rest step back */
  .dimmed { opacity:0.22 !important; filter:saturate(0.35);
    transition:opacity 0.35s, filter 0.35s; }
  .presented { box-shadow:0 16px 70px rgba(0,0,0,0.65),
      0 0 70px rgba(var(--c22),0.45); }
  /* ON-AIR (the OBS render page): backdrop-blur has nothing to sample
     in the compositor. GLASS ERA: the near-solid slabs died (Jared's
     8/13 call — "frankly more transparent") — true translucent glass,
     readability carried by the halo text-shadows below. */
  body.on-air .panel { background:linear-gradient(160deg, rgba(var(--c17),0.42), rgba(var(--c11),0.34)); backdrop-filter:none; }
  body.on-air .card  { background:linear-gradient(160deg, rgba(var(--c18),0.38), rgba(var(--c12),0.30)); backdrop-filter:none; }
  body.on-air .card p, body.on-air .panel .scroll {
    text-shadow:0 1px 3px rgba(var(--c3),0.95), 0 0 10px rgba(var(--c3),0.85); }
  body.on-air .card h3, body.on-air .panel .bar h3 {
    text-shadow:0 1px 3px rgba(var(--c3),0.95), 0 0 14px rgba(var(--c22),0.55); }
  /* the dwell CHARGE glow — the card announces it's about to open (the
     audience's cue once the cursor rings are hidden) */
  body.on-air .card, body.on-air .panel { --ch:0;
    box-shadow:0 8px 40px rgba(0,0,0,0.55),
      0 0 calc(24px + var(--ch)*70px) rgba(var(--c22),calc(0.10 + var(--ch)*0.75)),
      inset 0 1px 0 rgba(var(--c33),0.35); }
  #cam, #bgfx, #bgimg { position:absolute; inset:0; width:100%; height:100%;
                object-fit:cover; transform:scaleX(-1); }
  #bgfx, #bgimg { display:none; z-index:0; }
  body.bgon #bgfx { display:block; }
  body.bgdirect #bgfx { display:none; }
  /* the mirror belongs to the CAMERA, and this path has no camera in
     it, so a backdrop shown directly must not inherit the flip */
  body.bgdirect #bgimg { display:block; transform:none; }
  body.bgon #cam { opacity:0; }   /* still decoding, just not shown */
  .bgsw { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px;
          max-height:268px; overflow-y:auto; padding-right:4px; }
  .bgsw::-webkit-scrollbar { width:7px; }
  .bgsw::-webkit-scrollbar-thumb { background:rgba(var(--c33),0.35); border-radius:4px; }
  .bgsw div { position:relative; height:52px; border-radius:9px; cursor:pointer;
              overflow:hidden; background-size:cover; background-position:center;
              border:2px solid rgba(var(--c33),0.22); transition:all .15s ease;
              display:flex; align-items:center; justify-content:center;
              font:600 9.5px "SF Mono",Menlo,monospace; letter-spacing:0.08em;
              color:rgba(var(--c39),0.85); text-align:center; }
  .bgsw div:hover { border-color:rgba(var(--c33),0.6); }
  .bgsw div.on { border-color:rgb(var(--c22));
                 box-shadow:0 0 14px rgba(var(--c22),0.55); }
  body.overlay #cam, body.keybg #cam {
         width:2px; height:2px; opacity:0.01; pointer-events:none; }
  /* THE GLASS ERA (2026-08-13, Jared's redesign): clean CLEAR glass —
     low-alpha smoked fills you genuinely see through, one luminous
     edge, a specular kiss on top. No wireframe chrome; restraint IS
     the aesthetic. Readability rides halo text, not slab fills. */
  .card { position:absolute; width:480px; padding:22px 24px; border-radius:16px;
          background:linear-gradient(168deg, rgba(var(--c19),0.30), rgba(var(--c12),0.18));
          border:1.5px solid rgba(var(--c25),0.55);
          box-shadow:0 10px 44px rgba(0,0,0,0.40), 0 0 26px rgba(var(--c22),0.14),
                     inset 0 1px 0 rgba(var(--c35),0.55),
                     inset 0 -14px 30px rgba(var(--c22),0.05);
          color:rgb(var(--c42)); user-select:none; will-change:transform;
          transform-origin:center center; }
  body.keybg .card, body.keybg .panel { backdrop-filter:none;
          background:rgba(var(--c15),0.97); }
  .card h3 { margin:0 0 8px; font-size:19px; letter-spacing:0.08em; color:rgb(var(--c26));
             font-family:"SF Mono",Menlo,monospace; text-transform:uppercase; }
  /* THE RING (naked canvas, the modelcard pattern) + THE ORBITAL
     BLOOM orbs: the ring is the hub — tap it and your configured
     folders bloom around it as glass orbs. */
  .card.ringcard { width:440px; padding:0; background:transparent;
                   border:none; box-shadow:none; backdrop-filter:none; }
  .card.ringcard canvas { display:block; width:440px; height:440px;
                          pointer-events:none; }
  body:not(.on-air) .card.ringcard, .card.ringcard.grabbed,
  body.on-air .card.ringcard {
      box-shadow:none; border:none; background:transparent; }
  .card.ringcard.grabbed canvas {
      filter:brightness(calc(1.12 + var(--ch,0)*0.3)); }
  body.on-air .card.ringcard.grabbed canvas { filter:none; }
  .card.orb { width:150px; height:150px; border-radius:50%; padding:0;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; gap:2px; }
  .card.orb h3 { margin:0; font-size:16px; }
  .card.orb p { font-size:11.5px; color:rgb(var(--c31)); margin:0; }
  .card.imgcard { padding:6px; width:auto; overflow:hidden;
      border-color:rgba(var(--c22),0.5);
      box-shadow:0 8px 40px rgba(0,0,0,0.55), 0 0 30px rgba(var(--c22),0.20),
                 inset 0 1px 0 rgba(var(--c33),0.35); }
  .card.imgcard img { display:block; max-width:32vw; max-height:44vh;
                      border-radius:10px; pointer-events:none; }
  /* MATERIALIZE-AS-LIGHT (Jared's call 8/9): images ARRIVE as hologram
     — teal monochrome light + one scan sweep — then resolve to their
     TRUE colors. Theater at the edges, truth in the content (evidence
     stays evidence; the folder law's spirit for pixels). */
  .card.imgcard img, .card.imgcard video { transition:filter 0.5s ease-out; }
  .card.imgcard.mat img, .card.imgcard.mat video {
      filter:brightness(1.55) saturate(0.2) sepia(1) hue-rotate(115deg)
             saturate(2.4) drop-shadow(0 0 22px rgba(var(--c22),0.85)); }
  .card.imgcard.mat::after { content:""; position:absolute; left:0; right:0;
      height:16%; top:-20%; background:linear-gradient(180deg, transparent,
      rgba(var(--c33),0.75), transparent);
      animation:matscan 0.6s linear; pointer-events:none; }
  @keyframes matscan { from { top:-20%; } to { top:110%; } }
  /* THE FX LAYER (2026-08-08, Jared's idea: "throw me a fireball") —
     anything in media/fx/ (or any .webm) renders NAKED: no chip, no
     border, no shadow — a floating OBJECT with full physics. Alpha
     PNGs float; alpha WebMs loop silently. */
  .card.fxcard { padding:0; background:transparent; border:none;
                 box-shadow:none; backdrop-filter:none; }
  .card.fxcard img, .card.fxcard video { display:block; max-width:36vw;
                 max-height:52vh; border-radius:0; pointer-events:none; }
  /* kill EVERY rectangular glow layer on fx, both pages — the tracker's
     grab-glow and the render's always-on air-glow both paint box-shadows
     at higher specificity than the base fx class (the fireball's green
     halo+frame bug, Jared's catch 8/8). The object's own alpha
     silhouette carries the grab cue via drop-shadow instead. */
  body:not(.on-air) .card.fxcard, body:not(.on-air) .card.fxcard.grabbed,
  body.on-air .card.fxcard, .card.fxcard.grabbed {
      box-shadow:none; border:none; background:transparent; }
  /* grab cue: the object FLARES in the hand (brightness+saturation) —
     drop-shadow was the "green shadow behind it" bug: generated flames
     carry a wide semi-alpha haze and the shadow glows through all of it.
     On-air: no cue at all — bare-hands invisible magic. */
  .card.fxcard.grabbed,
  body:not(.on-air) .card.fxcard.grabbed {
      filter:brightness(1.18) saturate(1.2); }
  body.on-air .card.fxcard.grabbed { filter:none; }
  /* BUILD 1 — 3D HOLOGRAMS (2026-08-09, gestures at 1.4): a model
     renders NAKED like fx — transparent WebGL canvas, ZERO chrome (the
     1.1 handle-bar zone died to the no-small-targets law; the base bar
     killed at 1.3, Jared's call). Pinch = move; hold-still latches
     spin — the charge cue is the MODEL brightening via --ch; two hands
     = carry + twist-roll + scale (the 1.3 gimbal was rejected, one
     round). Folder = render law: holo/ = blue wire, else solid. Fixed
     480px both pages (the v20.4 law: identical geometry = 1:1). */
  .card.modelcard { padding:0; background:transparent; border:none;
                    box-shadow:none; backdrop-filter:none; width:480px; }
  .card.modelcard canvas { display:block; width:480px; height:480px;
                    pointer-events:none; }
  /* (the v1 holo CSS drop-shadow retired at 2.0 — the ghost-glass
     shader + its bloom rig carry the glow now) */
  body:not(.on-air) .card.modelcard, body:not(.on-air) .card.modelcard.grabbed,
  body.on-air .card.modelcard, .card.modelcard.grabbed {
      box-shadow:none; border:none; background:transparent; }
  .card.modelcard.grabbed canvas {
      filter:brightness(calc(1.18 + var(--ch,0)*0.4)) saturate(1.15); }
  /* ON-AIR: no grab/charge cue on models — the fx precedent (bare-hands
     invisible magic; the tracker stays Jared's confidence monitor). */
  body.on-air .card.modelcard.grabbed canvas { filter:none; }
  /* THE BROWSER PANES: tap an orb = a tall glass pane with an
     indented file tree; folders unfold IN PLACE; rows are fat tap
     zones. */
  .panel.browser { width:560px; height:720px; }
  .brow { display:flex; align-items:center; gap:12px; min-height:68px;
          border-bottom:1px solid rgba(var(--c22),0.12); font-size:18px; }
  .brow .bico { color:rgb(var(--c26)); width:28px; text-align:center; flex:none;
                font-size:20px; }
  .brow.dir .btxt { color:rgb(var(--c26)); font-weight:600; letter-spacing:0.02em; }
  .brow.note .btxt, .brow.prop .btxt, .brow.widget .btxt { color:rgb(var(--c42)); }
  .brow .btxt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* THE TAP FLASH (2026-08-13, the mirror-doctrine softener): the row
     you tap pulses full-width on BOTH pages. Rows span the pane and
     vertical never mirrors, so the pulse sits directly under the
     on-air fingertip even though horizontal touch offsets flip
     (the mirror doctrine). Also plain good feedback. */
  .brow.flash { animation:rowflash 0.6s ease-out; }
  @keyframes rowflash {
    from { background:rgba(var(--c25),0.4); }
    to   { background:transparent; } }
  .card p  { margin:0; font-size:17px; line-height:1.45; color:rgb(var(--c36)); text-shadow:0 1px 3px rgba(var(--c4),0.55); }
  .card p:empty { display:none; }
  .card.grabbed, .panel.grabbed { border-color:rgb(var(--c26));
          box-shadow:0 12px 60px rgba(0,0,0,0.7), 0 0 44px rgba(var(--c22),0.35); }
  /* v20.4: FIXED px (the 44vw×70vh of a 1920×1080 OBS canvas) so tracker
     and render wrap text identically — same content height on both sides
     makes the fractional scroll a true 1:1 (hand speed = on-air speed) */
  .panel { position:absolute; width:845px; height:756px; border-radius:18px;
           background:linear-gradient(172deg, rgba(var(--c16),0.36), rgba(var(--c10),0.24));
           border:1.5px solid rgba(var(--c25),0.6); color:rgb(var(--c42));
           box-shadow:0 16px 70px rgba(0,0,0,0.5), 0 0 50px rgba(var(--c22),0.16),
                      inset 0 1px 0 rgba(var(--c35),0.55);
           display:flex; flex-direction:column; will-change:transform; }
  .panel .bar { padding:42px 16px; border-bottom:1px solid rgba(var(--c22),0.3);   /* v3.8: THE GRIP BAR everywhere — notes + folders (grab = move, tap = close) */
                display:flex; justify-content:space-between; align-items:center; }
  .panel .bar h3 { margin:0; font-size:14px; color:rgb(var(--c26)); letter-spacing:0.08em;
                   font-family:"SF Mono",Menlo,monospace; text-transform:uppercase; }
  /* every window carries its own close, top right */
  .xbtn { position:absolute; top:10px; right:11px; width:26px; height:26px; padding:0;
          border-radius:50%; cursor:pointer; z-index:6; line-height:1;
          font:600 14px -apple-system,sans-serif;
          color:rgba(var(--c39),0.72); background:rgba(var(--c5),0.42);
          border:1px solid rgba(var(--c33),0.28); backdrop-filter:blur(6px);
          -webkit-backdrop-filter:blur(6px); opacity:0.62;
          transition:opacity .14s ease, background .14s ease, color .14s ease; }
  /* A 26px target is fine for a mouse and small for a tracked hand, so
     the button hit-tests over a wider area than it draws. The halo is
     part of the button, so elementFromPoint still answers with it. */
  .xbtn::before { content:""; position:absolute; inset:-15px; border-radius:50%; }
  .card:hover > .xbtn, .panel:hover > .xbtn { opacity:1; }
  .xbtn:hover { background:rgba(255,105,97,0.9); color:#fff;
                border-color:rgba(255,150,140,0.95); }
  .panel > .xbtn { top:13px; right:14px; width:30px; height:30px; font-size:15px; }
  body.overlay .xbtn { display:none; }   /* the broadcast has no chrome */
  .panel .close { width:30px; height:30px; border-radius:50%; text-align:center;
                  line-height:28px; border:1.5px solid rgba(var(--c22),0.65);
                  color:rgb(var(--c26)); font-size:15px; }
  .panel .body { flex:1; overflow:hidden; padding:14px 20px; }
  .panel .scroll { transition:none; font-size:14.5px; line-height:1.5; color:rgb(var(--c36)); text-shadow:0 1px 3px rgba(var(--c4),0.55);
                   white-space:pre-wrap; font-family:-apple-system,sans-serif; }
  .panel .scroll b { color:#fff; } .panel .scroll .h { color:rgb(var(--c26)); font-weight:700; }
  /* NOVROS: the resize corner announces itself on hover, so the grip is
     discoverable instead of being a secret 26px square. */
  .card.rotgrip::before, .panel.rotgrip::before {
    content:""; position:absolute; left:4px; bottom:4px; width:17px; height:17px;
    border-left:2.5px solid rgba(var(--c30),0.95);
    border-bottom:2.5px solid rgba(var(--c30),0.95);
    border-bottom-left-radius:11px; pointer-events:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
  .card.gripping::after, .panel.gripping::after {
    content:""; position:absolute; right:4px; bottom:4px; width:17px; height:17px;
    border-right:2.5px solid rgba(var(--c27),0.95);
    border-bottom:2.5px solid rgba(var(--c27),0.95);
    border-bottom-right-radius:5px; pointer-events:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
  /* ---------- NOVROS WIDGETS ---------- */
  .card.wdg { width:auto; padding:0; border-radius:22px; overflow:hidden;
              background:linear-gradient(165deg, rgba(var(--c30),0.34), rgba(var(--c5),0.26));
              border:1.5px solid rgba(var(--c33),0.42);
              box-shadow:0 14px 48px rgba(0,0,0,0.45), 0 0 30px rgba(var(--c33),0.14); }
  .card.wdg .win { padding:18px 20px; }
  .card.gamew { width:auto; padding:10px 10px 8px; border-radius:16px;
                background:linear-gradient(168deg, rgba(var(--c30),0.22), rgba(var(--c5),0.62));
                border:1.5px solid rgba(var(--c33),0.42);
                backdrop-filter:blur(16px) saturate(1.1);
                -webkit-backdrop-filter:blur(16px) saturate(1.1); }
  .card.gamew .gtitle { font:700 10px "SF Mono",Menlo,monospace; letter-spacing:0.2em;
                        color:rgba(var(--c22),0.95); text-transform:uppercase;
                        padding:2px 2px 8px; }
  .card.gamew canvas { display:block; border-radius:9px; }
  .wdg .wlbl { font:600 10.5px "SF Mono",Menlo,monospace; letter-spacing:0.16em;
               color:rgba(var(--c39),0.72); text-transform:uppercase; }
  .wdg .wbig { font:300 62px -apple-system,"SF Pro Display",sans-serif; line-height:1;
               color:rgb(var(--c41)); letter-spacing:-0.02em;
               text-shadow:0 2px 14px rgba(0,0,0,0.5); }
  .wdg .wmid { font:600 17px -apple-system,sans-serif; color:rgba(var(--c41),0.95); }
  .wdg .wsm  { font:500 12.5px -apple-system,sans-serif; color:rgba(var(--c39),0.8); }
  .wdg .strip { display:flex; gap:14px; margin-top:14px; padding-top:13px;
                border-top:1px solid rgba(var(--c33),0.22); }
  .wdg .strip div { text-align:center; flex:1; }
  .wdg .strip .h { font:600 11px "SF Mono",Menlo,monospace;
                   color:rgba(var(--c39),0.62); }
  .wdg .strip .t { font:600 14px -apple-system,sans-serif;
                   color:rgba(var(--c41),0.94); margin-top:5px; }
  .wdg canvas { display:block; }
  /* clock and date are the SAME square tile, the way a home screen
     pairs them; weather is the wide one. */
  .card.wdg.clockw, .card.wdg.datew { width:200px; height:200px; }
  .card.wdg.clockw .win, .card.wdg.datew .win {
     box-sizing:border-box; height:100%; display:flex; }
  .card.wdg.clockw .win { align-items:center; justify-content:center; padding:20px; }
  .card.wdg.datew .win { flex-direction:column; align-items:center;
     justify-content:center; padding:18px; }
  .card.wdg.weatherw { width:362px; }
  .card.wdg.newsw { width:540px; }
  .card.wdg.terminalw { width:406px; }
  .card.wdg.terminalw .win { padding:13px; }
  .card.wdg.terminalw canvas { display:block; border-radius:8px;
    background:linear-gradient(170deg, rgba(0,0,0,0.30), rgba(0,0,0,0.52)); }
  .card.shapew { width:auto; padding:11px; border-radius:16px;
    background:linear-gradient(168deg, rgba(var(--c30),0.14), rgba(var(--c5),0.55));
    border:1.5px solid rgba(var(--c33),0.38);
    backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); }
  .card.shapew canvas { display:block; border-radius:10px; }
  .card.wdg.newsw .win { padding:15px 0 14px; }
  .card.wdg.newsw .wlbl { padding:0 20px; }
  .nwin { overflow:hidden; width:100%; margin-top:11px;
          -webkit-mask:linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
          mask:linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }

     alive, but every /orb /tree /note /state call dies silently: you can pinch

    '<p>You opened this file directly, so there is no server behind it. The camera and the gestures will still work, ' +
    'but nothing will ever <b>open</b>: tapping a card asks the server for the file, and there is nothing to ask.</p>' +
    '<p style="margin-top:16px">Start it from the barehands folder:</p>' +
    '<pre style="background:rgb(var(--c8));border:1px solid rgb(var(--c14));padding:12px 14px;border-radius:8px;color:rgb(var(--c28))">' +
    'python3 server.py      <span style="color:rgb(var(--c20))"># Windows: python server.py</span></pre>' +

    '<pre style="background:rgb(var(--c8));border:1px solid rgb(var(--c14));padding:12px 14px;border-radius:8px;color:rgb(var(--c28))">' +

  throw new Error("barehands: opened over file://, server required");
}

// so with no internet the boot screen sits forever with no error. Say so.
setTimeout(function () {
  var b = document.getElementById("boot");

    '<span style="color:rgb(var(--c23));font-size:12px">still loading? the first run downloads the hand tracker and needs internet once. TROUBLESHOOTING.md has more.</span>';
}, 12000);

const Q = new URLSearchParams(location.search);
// ?res=WxH — capture resolution (default 1920x1080, the tracking sweet
// spot: MediaPipe downscales every frame to its model input anyway, so
// higher res buys self-view sharpness, never accuracy — and costs fps
// on weak machines; 1280x720 is the low-end saver, 3840x2160 the 4K

// sees OBS's own camera source; this only shapes the tracker's sensor.
// ?portrait=1 — request the vertical capture instead of coercing the
// camera into landscape (a camera flipped to portrait negotiates its
// 9:16 mode). Composes with ?res=: portrait swaps the dimensions.
// Everything downstream is aspect-agnostic (fractions + cover-fit):
// shape the tracker WINDOW to match, 9:16 OBS canvas for the render.
const PORTRAIT = Q.get("portrait") === "1";
const RES = (() => {
  const m = /^(\d{3,4})x(\d{3,4})$/i.exec(Q.get("res") || "");
  return m ? [+m[1], +m[2]] : [1920, 1080];
})();
let MODE = Q.get("mode") || "mirror";
if (MODE === "greenkey") { MODE = "key"; Q.set("key", "green"); }   // back-compat
if (MODE === "overlay") {
  document.body.classList.add("overlay");
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
}
if (MODE === "key") {
  const KEYS = { magenta: "#ff00ff", green: "#00ff00", blue: "#0000ff" };
  const want = (Q.get("key") || "magenta").toLowerCase();
  const color = KEYS[want] || (want.startsWith("#") ? want : "#ff00ff");
  document.body.classList.add("keybg");
  document.body.style.background = color;

// ============================================================
// NOVROS CONTROL LAYER  (added 2026-09-20)
// ------------------------------------------------------------
// Every interaction gate below used to be a RAW SCREEN PIXEL number,
// fitted on a single 1920x1080 window with a front-facing camera.
// Two consequences, both reported from the field:
//   1. On a bigger/denser display the same physical hand motion covers
//      more pixels, so taps exceed their travel budget and become drags,
//      and ordinary moves exceed the fling bar and fly off screen.
//   2. With the camera OFF TO THE SIDE the hand sits in the "profile"
//      regime, where the pinch gate is at its loosest -- so the cursor
//      grabs things in passing, and the wide release band makes the
//      bogus grab stick.
// These gates are now expressed as multiples of SPAN: the hand's own
// wrist-to-middle-knuckle length, measured in screen pixels. That is
// the same "measure the hand against itself" philosophy the claw and
// pinch shape-gates already use, extended to the distance gates, so it
// holds at any display size and any camera distance.
//
// Live-tunable from the console -- window.TUNE.<key> = n -- effective
// on the very next frame. No reload, no restart.
// ============================================================
const TUNE = {
  // --- tap: open / close ---
  tapMs:         340,    // max grip duration that still counts as a tap
  tapTravel:     0.34,   // xSPAN  cursor drift allowed inside a tap
  // --- grab ---
  hitPad:        0.10,   // xSPAN  hit-target inflation around every item
  // --- pinch ---
  releaseBar:    0.46,   // pinch ratio at which a slow hand lets go (was 0.55)
  releaseFast:   0.62,   // ... at which a fast hand lets go        (was 0.70)
  fastHandSpan:  6.7,    // SPAN/s  what counts as a "fast" hand    (was 800px/s)
  profileTRel:   1.05,   // profile-lane thumb-off-knuckle floor    (was 0.95)
  // --- rotate ---
  autoRotate:    false,  // hold-still-to-3D-rotate auto-latch. DEFAULT OFF:
                         // it was firing uninvited on whatever a stray pinch
                         // happened to be holding. Set true to restore.
  rotateStill:   0.38,   // xSPAN  stillness that keeps the latch armed
  // --- scroll -> move promotion ---
  scrollStill:   0.68,   // xSPAN  stillness that keeps that timer armed
  // --- throw ---
  flingSpan:    11.0,    // SPAN/s  fling speed bar (was a flat 1300 px/s)
  // --- pointing (index-finger pointer + tap-to-click) ---
  pointContrast: 0.18,   // index arch MINUS back-three arch: the exact
                         // mirror of the pinch's CONTRAST LAW, so the two
                         // poses can never be confused with each other
  pointArch:     1.30,   // index must genuinely reach out past its knuckle
  pointDip:      1.12,   // absolute bend floor (kept as a second chance)
  // THE PRESS, chiefly measured as the THUMB closing onto the pointing
  // index. The finger-bend test below it is a 2D projection of how far
  // the tip sits from the wrist, which barely moves when the press is a
  // forward jab -- and with the camera off to one side, that is the
  // press most people make. The thumb travels ACROSS the palm, so it
  // reads clearly from any angle, and it reuses `ratio`, the most
  // reliable measurement in the whole tracker.
  pressBend:     false,  // the finger-bend press. OFF: it latched on
                         // tracker jitter and would not let go
  dragStart:     0.34,   // xSPAN the pointer must travel with the button
                         // held before it counts as a drag rather than
                         // a click. Below this you are aiming, not moving.
  pressFrac:     0.58,   // press when the gap closes to this much of how
                         // open YOUR hand rests -- measured, not guessed
  pressOut:      0.80,   // and release when it opens back past this
  pressGap:      0.46,   // (unused while the adaptive gap is in charge)
  pressRelease:  1.38,
  pointDipFrac:  0.82,   // the bend test, kept as a second way in: a
                         // how straight YOUR finger was a moment ago, so it
                         // works for a small press and for any hand
  pointRecFrac:  0.92,   // ... and it must come back up past this to fire
  dwellClick:    false,  // hover-to-click. OFF: the thumb is an explicit
                         // button now, and an interface that also fires
                         // on its own is one you cannot rest a hand in.
  dwellMs:       140,    // rest-to-fire delay once the hand has STOPPED.
                         // Short on purpose: the safety is not the clock,
                         // it is the stopping (see dwellMoveBar).
  dwellMoveBar:  1.8,    // SPAN/s  above this the hand is TRAVELLING, and a
                         // travelling hand never selects anything. This is
                         // what makes instant selection safe to browse with.
  dwellCoolMs:   450,    // pause after a dwell fires
  // --- head control plane (press H) ---
  headGain:      3.4,    // screen travel per unit of head turn
  headDeadzone:  0.012,  // ignore turns smaller than this, so a still
                         // head gives a still cursor instead of drifting
  headSmooth:    0.55,   // how still the head cursor sits. Lower is
                         // calmer; a head needs far more smoothing than
                         // a fingertip, and its turn is amplified.
  headBeta:      0.008,  // how quickly it gives that up when you move
  blinkScore:    0.5,    // eye-closed confidence from the face model
  blinkOpenMax:  0.25,   // ... and what counts as definitely OPEN
  blinkMinMs:    190,    // shorter than this is an INVOLUNTARY blink and
                         // is ignored -- natural blinks run 100-150ms
  blinkMaxMs:   1300,    // longer than this is resting, not a click
  doubleBlinkMs: 620,    // two deliberate blinks inside this = double
  winkMs:        260,    // one eye held shut = pick up / put down
  winkDrag:      true,
  // --- rotation ---
  rotGain:      0.0055,  // radians of tumble per pixel of drag. Half what
                         // it was: the old rate crossed a right angle in
                         // 130px, which is a flick, not a control.
  rotFine:      0.28,    // hold SHIFT for fine rotation
  rotSmooth:    0.055,   // seconds: rotation EASES to where you point it
                         // instead of snapping, which is most of what
                         // makes it feel controllable rather than twitchy
  // --- two-finger scroll ---
  newsPace:      8,      // seconds per headline in the ticker. Paced by
                         // how many there are, so a long run does not
                         // become a blur and a short one a crawl.
  scrollGain:    1.6,    // content travel per unit of hand travel
  twoFingerScroll: true, // index + middle out = scroll, like a trackpad
  menuScale:     0.5,    // the CENTRE ring only. The stations around it
                         // keep their own size and simply close in.
  // --- the system hand ---
  systemHand:    true,   // the LEFT hand drives the OS, not a second mouse
  swapHands:     false,  // set true if your hands come out the wrong way
                         // round -- handedness is reported against the
                         // raw camera image, not the mirrored view
  pointGraceMs:  520,    // pointer stays engaged through a click's dip
  pointTapMs:    420,    // max duration of the bend that counts as a click
  doubleMs:      420,    // two clicks inside this = a double click
  // --- cursor smoothing (One Euro) ---
  euroMinCutoff: 1.2,    // lower  = smoother while the hand is still
  euroBeta:      0.030,  // higher = more responsive while it moves
  euroDCutoff:   1.0,
};
if (typeof window !== "undefined") window.TUNE = TUNE;

// The live hand span in screen px, smoothed. Seeded with a sane value so
// the gates behave before the first hand is ever seen.
let SPAN_PX = 120;
const spanU = m => m * SPAN_PX;     // span-relative -> screen pixels

// ---- ONE EURO FILTER -------------------------------------------------
// Replaces the old fixed `cur.x += (px - cur.x) * 0.45` EMA, which was
// simultaneously too laggy for a snap-tap and too jittery to hold still,
// and whose real strength drifted with framerate (it ran once per CAMERA
// frame, so at 15fps it barely smoothed at all). One Euro adapts: heavy
// smoothing when the hand is nearly still -- which is exactly when a
// tap's travel budget needs protecting -- and light smoothing when it
// moves, so drags stay responsive. Standard Casiez/Roussel/Vogel filter.
function makeEuro(opt) {
  let xPrev = null, dxPrev = 0, tPrev = 0;
  const minCut = () => (opt && opt.minCutoff) ? opt.minCutoff() : TUNE.euroMinCutoff;
  const bta = () => (opt && opt.beta) ? opt.beta() : TUNE.euroBeta;
  const alpha = (cutoff, dt) => {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  };
  return function (x, t) {
    if (xPrev === null) { xPrev = x; tPrev = t; return x; }
    let dt = (t - tPrev) / 1000;
    if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
    tPrev = t;
    const dx = (x - xPrev) / dt;
    dxPrev = dxPrev + alpha(TUNE.euroDCutoff, dt) * (dx - dxPrev);
    const cutoff = minCut() + bta() * Math.abs(dxPrev);
    xPrev = xPrev + alpha(cutoff, dt) * (x - xPrev);
    return xPrev;
  };
}

// ---- THE POINTER'S CLICK -------------------------------------------
// OS semantics, as asked for: ONE tap opens a folder (the ring's bloom,
// an orb's pane, a row inside a pane); TWO taps open a file, or close
// whatever is already open. Pointing never grabs, so tracking across the
// board can no longer drag or rotate things in passing.
function pointSingle(cur) {
  if (pointerHitClose(cur)) return;
  const c = hitTest(cur);
  if (!c) return;
  if (c.type === "widget" && c.def.w === "ring") {
    const sc = RINGS.get(c.id);
    if (sc) sc.tapT = Date.now() / 1000;
    return ringToggle(c);
  }
  if (c.type === "orb")     return orbActivate(c);
  if (c.type === "browser") return browserTap(c, cur);
}
function pointDouble(cur) {
  const c = hitTest(cur);
  if (!c) return;
  if (c.type === "card" && c.def.file)            return openPanel(c);
  if (c.type === "img" || c.type === "model" || c.type === "wdg" ||
      c.type === "shape" || c.type === "panel" ||
      c.type === "browser") return killItem(c);
}
// Activation happens WHERE YOU PRESSED and the instant you let go.
// Both matter. It used to wait 420ms to see whether a second click was
// coming, then read the cursor's position at the END of that wait -- so
// a hand that drifted a few pixels while waiting activated something
// else, or nothing. And a small target like a close button is exactly
// where that drift costs you the click.
function pointActivate(x, y, cur) {
  const at = { x: x ?? cur.x, y: y ?? cur.y };
  const el = document.elementFromPoint(at.x, at.y);
  const b = el && el.closest && el.closest(".xbtn");
  if (b) {
    const it = items.find(i => i.el === b.parentElement);
    if (it) { killItem(it); foley && foley.grab && foley.grab(); }
    return;
  }
  const c = hitTest(at);
  if (!c) return;
  foley && foley.grab && foley.grab();
  if (c.type === "widget" && c.def.w === "ring") {
    const sc = RINGS.get(c.id);
    if (sc) sc.tapT = Date.now() / 1000;
    return ringToggle(c);
  }
  if (c.type === "orb")     return orbActivate(c);
  if (c.type === "browser") return browserTap(c, at);
  if (c.type === "card" && c.def.file) return openPanel(c);
  if (c.type === "img" || c.type === "model") return killItem(c);
  if (c.type === "panel") {                   // notes close at the bar
    const barEl = c.el.querySelector(".bar");
    const r = barEl && barEl.getBoundingClientRect();
    if (r && at.y >= r.top && at.y <= r.bottom) killItem(c);
  }
}
function pointClick(cur) { pointActivate(cur.x, cur.y, cur); }

// One shared tap test, replacing four divergent copies (300ms/26px and
// 350ms/24px) that had drifted apart across versions.
function isTap(cur, c) {
  // THE MOUSE OPTS OUT. endGrab() runs these tap tests for a HAND; the
  // mouse layer decides its own clicks in mouseup, by whether the
  // pointer travelled. Without this both paths fired, so every mouse
  // click ran its action twice -- which is why a folder row appeared
  // dead: browserTap expanded it and then immediately collapsed it.
  if (cur.isMouse) return false;
  const ms = performance.now() - (cur.grabT || 0);
  const trav = Math.hypot(cur.x - (c.tapX ?? cur.x), cur.y - (c.tapY ?? cur.y));
  return ms < TUNE.tapMs && trav < spanU(TUNE.tapTravel);
}

const cam = document.getElementById("cam");
const BEHIND = document.getElementById("behind");
const dbg = document.getElementById("debug");
let items = [];        // cards + panels: {el,type,x,y,scale,vx,vy,grabbedBy:[],ox,oy,flying,file,stretch,scrollY,body}
let cursors = {};
let SAMPLER = null;    // the pose sampler (dormant — claw/pinch tuning)
let CLAPSAMP = null;   // the P clap recorder (v3.9.1)
let SAMPLED = "";      // its frozen last result (D overlay)
let landmarker = null, lastVideoTs = -1, frames = 0, fps = 0, lastFpsTs = performance.now();

let UID = 1;

// A single delegate: find the window that owns the pressed button and
// send it through the same graceful exit every other close uses.
addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".xbtn");
  if (!b) return;
  e.stopPropagation(); e.preventDefault();
  const host = b.parentElement;
  const it = items.find(i => i.el === host);
  if (it) killItem(it);
  else if (host) host.remove();
}, true);

// The hand and head planes do not know about DOM buttons, so give the
// pointer the same target: resting on the X closes the window, which is
// otherwise only reachable with a mouse.
function pointerHitClose(cur) {
  const el = document.elementFromPoint(cur.x, cur.y);
  const b = el && el.closest && el.closest(".xbtn");
  if (!b) return false;
  const it = items.find(i => i.el === b.parentElement);
  if (it) killItem(it);
  return true;
}

// One close affordance for every window. A <button> on purpose: the
// mouse layer already stands aside for real controls, so pressing this
// cannot also grab the window underneath it.
function closable(el) {
  const b = document.createElement("button");
  b.className = "xbtn";
  b.type = "button";
  b.title = "close";
  b.textContent = "\u2715";
  el.appendChild(b);
  return el;
}

function makeCard(def) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<h3>${escT(def.title)}</h3><p>${escT(def.body || "")}</p>`;
  closable(el);
  BEHIND.appendChild(el);
  return { el, id: UID++, type: "card", def, x: 0, y: 0, scale: 1, vx: 0, vy: 0,
           grabbedBy: [], ox: 0, oy: 0, flying: false, stretch: null };
}

// ---- FOLEY (2026-08-07): synthesized WebAudio — the objects make SOUND,
// which is what makes invisible cards feel physical. Plays from the
// TRACKER page through Mac audio, captured by the existing stream rig.
// Chrome arms audio on the first user gesture (any key/click).
// foley ships OFF by default (a field call: the sounds read as noise
// on camera). The engine stays; &sound=1 turns it on.
const SOUND = Q.get("sound") === "1";
let AC = null;
function _ac() {
  if (!AC) { try { AC = new (window.AudioContext || webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume().catch(() => {});
  return AC;
}
addEventListener("keydown", _ac); addEventListener("click", _ac);

function _noise(dur, fLo, fHi, gain, sweepTo) {
  if (!SOUND) return;
  const ac = _ac(); if (!ac || ac.state !== "running") return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime((fLo + fHi) / 2, ac.currentTime);
  if (sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, ac.currentTime + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(); src.stop(ac.currentTime + dur);
}
function _tone(freq, dur, gain = 0.08, type = "sine", sweepTo = 0, delay = 0) {
  if (!SOUND) return;
  const ac = _ac(); if (!ac || ac.state !== "running") return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur);
}
const foley = {
  grab:    () => { _noise(0.04, 900, 2200, 0.10); _tone(150, 0.06, 0.10); },
  place:   () => _tone(120, 0.06, 0.07),
  throw_:  () => _noise(0.22, 300, 900, 0.14, 1600),
  void_:   () => { _noise(0.25, 500, 1400, 0.12, 180); _tone(280, 0.28, 0.09, "square", 70); },
  arrive:  () => { _tone(523, 0.10, 0.06); _tone(659, 0.10, 0.06, "sine", 0, 0.07); _tone(784, 0.14, 0.07, "sine", 0, 0.14); },
  yank:    () => { _tone(220, 0.12, 0.10, "sawtooth", 900); _noise(0.06, 1200, 3000, 0.08); },
};

function makeImage(src, title) {

function summonWidget(w) {
  // the assistant ring is the only built-in widget
  if (w && w !== "ring") return null;
  const ex = items.find(i => i.type === "widget" && i.def.w === "ring");

// ---- THE RING — the assistant's presence as a grabbable power-core
// ring: concentric glass rings, tick ring, wordmark core. BOTH pages
// animate it LOCALLY from /orb (the assistant's state files) on
// wall-clock phases — tracker and overlay pulse as one; only
// position/scale/rotation travel the bus. States: idle breath ·
// listening (deep blue, pulses draw INWARD — blue = the human
// talking) · thinking (radar sweep) · speaking (the live waveform
// drives glow/thickness/core through an auto-gain). Moods tint the
// whole ring red/amber.
const RING = {
  data: { state: "idle", mood: "green", wave: null }, amp: 0, gmax: 1,
  live: 0,
  // palette eyedropped from the design reference (exact reference
  // colors, SUBTLE state shifts — a deep-blue listening state was
  // unreadable and died)
  COLS0: { idle: [140, 235, 240], listening: [120, 205, 250],
           thinking: [150, 240, 210], speaking: [190, 250, 245] },
  COLS: { idle: [140, 235, 240], listening: [120, 205, 250],
          thinking: [170, 245, 250], speaking: [140, 235, 240] },
  MOODT: { red: [255, 82, 82], amber: [255, 179, 71], green: null },
};
setInterval(async () => {
  if (!RING.live) return;               // poll only while a ring is up
  try {
    const r = await fetch("/orb", { cache: "no-store" });
    if (r.ok) RING.data = await r.json();
  } catch (e) {}
}, 120);

function ringAmp() {
  // the preserved aura pulse math: RMS+peak blend, auto-gain against a
  // rolling ceiling, contrast-expanded, fast attack / musical decay
  const d = RING.data;
  let target = 0;
  if (d.state === "speaking" && d.wave && d.wave.length) {
    let s = 0, pk = 0;
    for (const v of d.wave) { s += v * v; pk = Math.max(pk, Math.abs(v)); }
    const raw = 0.6 * Math.sqrt(s / d.wave.length) + 0.4 * pk;
    RING.gmax = Math.max(raw, (RING.gmax || 1) * 0.995);
    target = Math.pow(Math.min(1, raw / Math.max(3, RING.gmax)), 2.2);
  }
  RING.amp += (target - RING.amp) * (target > RING.amp ? 0.6 : 0.2);
  return RING.amp;
}

const RINGS = new Map();      // this page's ring canvases: item id -> sc

function ringCanvas(el) {
  const canvas = el.querySelector("canvas");
  const RES = Math.min(devicePixelRatio || 1, 2);
  canvas.width = 440 * RES; canvas.height = 440 * RES;
  return { canvas, ctx: canvas.getContext("2d"), RES, tapT: 0 };
}

function makeRing() {
  const el = document.createElement("div");
  el.className = "card ringcard";
  el.innerHTML = `<canvas></canvas>`;
  BEHIND.appendChild(el);
  const it = { el, id: UID++, type: "widget",
    def: { title: (CFG.name || "Ring"), file: "", w: "ring" },
    x: innerWidth * 0.30, y: innerHeight * 0.45, scale: 1,
    vx: 0, vy: 0, grabbedBy: [], ox: 0, oy: 0, flying: false, stretch: null };
  it.anim = { k: "in", t: 0 }; it.el.style.opacity = "0.05";
  RINGS.set(it.id, ringCanvas(el));
  items.push(it);
  return it;
}

function ensureRingRes(sc) {
  // the models' adaptive-resolution law, for the ring (round 4, Jared's
  // pixelation catch on stretch): re-rez on settle only — never mid-
  // grip — 25% hysteresis, 2048 cap, never below the 440 base
  if (sc.held) return;
  const want = Math.round(Math.min(2048, Math.max(440,
    440 * (devicePixelRatio || 1) * SS * (sc.scale || 1))));
  if (Math.abs(want - sc.canvas.width) / (sc.canvas.width || 1) < 0.25) return;
  sc.canvas.width = want; sc.canvas.height = want;
  sc.RES = want / 440;
}

function drawRing(sc) {
  // NO spin — the ring is still; ONE solid thick band + solid hot
  // rim; SPEAKING = the band pulses HOT WHITE on the live voice.
  // Core is CLEAR glass, wordmark + status sized to fill it.
  const d = RING.data, st = d.state || "idle";
  const amp = st === "speaking" ? ringAmp() : (RING.amp *= 0.9);
  const t = Date.now() / 1000;          // wall clock: pages in sync
  const base = RING.COLS[st] || RING.COLS.idle;
  const tint = RING.MOODT[d.mood];
  const c = tint ? base.map((v, i) => Math.round(v * 0.35 + tint[i] * 0.65))
                 : base;
  // v4: SPEAKING = the band burns toward HOT WHITE on the live voice
  const wp = st === "speaking" ? amp : 0;
  const bc = c.map((v, i) => Math.round(v + ([235, 250, 252][i] - v) * wp));
  const col = a => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const band = a => `rgba(${bc[0]},${bc[1]},${bc[2]},${a})`;
  const hot = a => `rgba(var(--c38),${a})`;    // the white-hot rim
  const x = sc.ctx;
  ensureRingRes(sc);                    // the pixelation fix (round 4)
  const tap = Math.exp(-Math.max(0, t - sc.tapT) * 4);
  const breath = 0.9 + 0.1 * Math.sin(t * 1.4);
  const glow = (10 + wp * 34 + tap * 14) * breath;
  x.setTransform(sc.RES, 0, 0, sc.RES, 0, 0);
  x.clearRect(0, 0, 440, 440);
  x.save();
  x.translate(220, 220);
  x.shadowColor = band(0.95);
  // THE BAND — ONE solid piece, perfectly still — it PULSES HOT
  // WHITE while the assistant speaks, riding the live waveform
  x.shadowBlur = glow + 8;
  x.strokeStyle = band(0.92);
  x.lineWidth = 20 + wp * 3;
  x.beginPath(); x.arc(0, 0, 178, 0, 7); x.stroke();
  // solid hot rim + inner thin ring
  x.shadowBlur = 6 + wp * 14;
  x.strokeStyle = hot(0.85); x.lineWidth = 2.5;
  x.beginPath(); x.arc(0, 0, 191, 0, 7); x.stroke();
  x.shadowBlur = 6;
  x.strokeStyle = col(0.5); x.lineWidth = 1.5;
  x.beginPath(); x.arc(0, 0, 165, 0, 7); x.stroke();
  // tick ring (static chrome)
  x.shadowBlur = 0;
  for (let i = 0; i < 48; i++) {
    const a = i / 48 * Math.PI * 2;
    const big = i % 4 === 0;
    x.strokeStyle = col(big ? 0.6 : 0.3);
    x.lineWidth = big ? 2 : 1.2;
    x.beginPath();
    x.moveTo(Math.cos(a) * (big ? 148 : 152), Math.sin(a) * (big ? 148 : 152));
    x.lineTo(Math.cos(a) * 158, Math.sin(a) * 158);
    x.stroke();
  }
  // state FX in the band between ticks and core
  if (st === "listening") {             // pulses draw INWARD: receiving
    for (let k = 0; k < 3; k++) {
      const p = (t * 0.7 + k / 3) % 1;
      x.globalAlpha = (1 - p) * p * 1.8;
      x.strokeStyle = col(0.9); x.lineWidth = 2;
      x.beginPath(); x.arc(0, 0, 158 - p * 60, 0, 7); x.stroke();
    }
    x.globalAlpha = 1;
  } else if (st === "thinking") {       // radar sweep with a fading tail
    const a0 = t * 2.8;
    for (let i = 0; i < 7; i++) {
      x.globalAlpha = 0.55 * (1 - i / 7);
      x.strokeStyle = col(0.95); x.lineWidth = 10; x.shadowBlur = 12;
      x.beginPath();
      x.arc(0, 0, 148, a0 - (i + 1) * 0.11, a0 - i * 0.11); x.stroke();
    }
    x.globalAlpha = 1; x.shadowBlur = 0;
  }
  // THE CORE — CLEAR glass (round 4: the dark overlay died) — just the
  // rims; the video breathes through the center
  x.shadowBlur = glow;
  x.strokeStyle = col(0.9); x.lineWidth = 2.5 + wp * 2;
  x.beginPath(); x.arc(0, 0, 128, 0, 7); x.stroke();
  x.shadowBlur = 0;
  x.strokeStyle = col(0.3); x.lineWidth = 1;
  x.beginPath(); x.arc(0, 0, 119, 0, 7); x.stroke();
  // wordmark + status — sized UP (round 4: the clear core has room);
  // dark halo shadow keeps them readable over live video
  x.shadowColor = "rgba(var(--c2),0.9)"; x.shadowBlur = 7;
  // canvas cannot resolve a CSS variable, so this is read out first --
  // as `rgba(var(--c41),…)` the whole fill was invalid and silently
  // ignored, leaving the wordmark in whatever colour was set before it
  x.fillStyle = `rgba(${inkRGB()},${0.94 + wp * 0.06})`;
  const nm = NOV_NAME;
  const fpx = nm.length <= 6 ? 34 : nm.length <= 9 ? 25 : 18;
  x.font = `700 ${fpx}px 'SF Mono', Menlo, monospace`;
  x.textAlign = "center"; x.textBaseline = "middle";
  // NOVROS reads as a wordmark, not as spaced-out initials
  x.fillText(nm, 0, -13);
  x.globalAlpha = 0.85;
  x.fillStyle = col(0.98);
  x.font = "600 14px 'SF Mono', Menlo, monospace";
  // idle says what to DO, not what it IS: START when the menu is shut,
  // MENU while it is open. The live states still speak for themselves.
  const bloomUp = items.some(i => i.type === "orb" && i.el.isConnected);
  const status = st === "idle" ? (bloomUp ? "MENU" : "START")
    : ({ listening: "LISTENING", thinking: "THINKING",
         speaking: "SPEAKING" }[st] || "START");
  x.fillText(status.split("").join(" "), 0, 30);
  x.shadowBlur = 0; x.globalAlpha = 1;
  x.restore();
}

function renderRings() {
  RINGS.forEach((sc, id) => {
    if (!sc.canvas.isConnected) { RINGS.delete(id); return; }
    // feed scale + grip for the adaptive re-rez (tracker side; the
    // render page feeds these from the bus in renderLoop)
    const holder = items.find(k => k.id === id);
    if (holder) { sc.scale = holder.scale;
                  sc.held = holder.grabbedBy.length > 0; }
    drawRing(sc);
  });
  RING.live = RINGS.size;
}

// ---- 3D HOLOGRAMS —
// GLB/glTF models as first-class board objects. three.js arrives by
// dynamic import on the FIRST model staged (the import map in <head>
// resolves the bare specifiers), so the page still boots offline and
// the render page only pays the cost if a model actually appears.
// Modes: "holo" (hologram-blue emissive wireframe) and
// "solid" (real textures); a filename like ...-solid.glb forces solid,
// a {"mode":"solid"} param on the command overrides either way.
const MODEL_PX = 480;
const MSCENES = new Map();     // tracker: item id -> live three.js bundle
let _three = null;

function isModelSrc(s) { return /\.(glb|gltf)(\?|$)/i.test(s || ""); }

function modelModeFor(src, want) {
  // Build 1.4 (Jared's design): the FOLDER is the render law, exactly
  // like fx/ — anything in holo/ renders as the blue wire (reserved
  // for 3D sketches/layouts); everything else renders REAL (solid).
  // The command param still overrides for one-off forces.
  if (want === "solid" || want === "holo") return want;
  return /\/holo\//i.test(src || "") ? "holo" : "solid";
}

function liftTranslucentArt(obj, THREE, want) {
  // THE GLOW LIFT: translucent-art models are authored as
  // low-opacity veils for OPAQUE viewer backdrops (one veil-art
  // test case: a single material at 16.5% alpha, 14 stacked
  // shells); over live video a veil reads as
  // nothing. Lift: opacity ~3x + the model's own color texture fed
  // back as self-illumination so it carries its own light. Auto for
  // any transparent material under 0.5 opacity; {"lift":0} disables,
  // {"lift":1} forces every transparent material. Opaque models and
  // deliberately-hidden helper materials (opacity ~0) are untouched.
  if (want === 0) return 0;
  // THE GLASS-WINDOW VERDICT (a real-car-model catch — the car
  // rendered as a white ghost with an outer glow): veil-ART is
  // MOSTLY translucent (veil art: every shell transparent); a REAL
  // model with a few glass parts is not. One windshield used to drag
  // the whole car through the art bloom. Now: unless lift is FORCED,
  // auto-lift only fires when most of the model's materials are
  // translucent candidates.
  if (want !== 1) {
    let cand = 0, total = 0;
    const pre = new Set();
    obj.traverse(n => {
      if (!n.isMesh) return;
      (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => {
        if (!m || pre.has(m)) return;
        pre.add(m);
        total++;
        if (m.transparent && m.opacity > 0.02 && m.opacity < 0.5) cand++;
      });
    });
    if (total === 0 || cand / total < 0.5) return 0;
  }
  let lifted = 0;
  const seen = new Set();
  obj.traverse(n => {
    if (!n.isMesh) return;
    (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      if (!m.transparent || m.opacity <= 0.02) return;
      if (want !== 1 && m.opacity >= 0.5) return;
      m.opacity = Math.min(1, m.opacity * 3);
      if (m.map) {
        // THE MIP MURDER (proven in the headless harness, 8/9): thin-
        // fiber art sampled at minification reads the deep mip levels,
        // and every deep mip of a rainbow texture averages to GREY —
        // the model erases its own colors at small sizes. No mips =
        // the colors survive at any scale.
        m.map.minFilter = THREE.LinearFilter;
        m.map.needsUpdate = true;
      }
      if ('emissive' in m) {
        if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
        else m.emissive.copy(m.color);
        m.emissiveIntensity = 1.0;
      }
      if ('clearcoat' in m) m.clearcoat = 0;          // white gloss stack
      if ('specularIntensity' in m) m.specularIntensity = 0;
      if ('envMapIntensity' in m) m.envMapIntensity = 0;
      if ('metalness' in m) m.metalness = 0;
      m.needsUpdate = true;
      lifted++;
    });
  });
  return lifted;
}

function _bloomQuad(THREE, frag, uniforms) {
  const s = new THREE.Scene();
  const g = new THREE.PlaneGeometry(2, 2);
  const m = new THREE.ShaderMaterial({ uniforms, depthTest: false, depthWrite: false,
    vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }",
    fragmentShader: frag });
  s.add(new THREE.Mesh(g, m));
  return { s, g, m, cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1) };
}

function buildBloomRig(THREE, renderer, o) {
  o = o || { k: 2.2, sat: 2.6, spread: 2.6 };
  // THE GLOW BLOOM (harness-verified against a reference render):
  // hand-rolled alpha-correct bloom for lifted
  // glow models — scene to texture, half-res two-round gaussian,
  // composite base + SATURATED glow with accumulated alpha so the haze
  // composites over live video like real light, ACES + gamma done in
  // the composite shader (RT renders skip three's output transforms).
  // The stock UnrealBloomPass was rejected: it stomps the alpha
  // channel and blacks out transparent canvases.
  const size = new THREE.Vector2();
  renderer.getDrawingBufferSize(size);
  const mk = (w, h, smp) => new THREE.WebGLRenderTarget(w, h,
    { samples: smp || 0, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  return {
    rtScene: mk(size.x, size.y, 4),
    rtA: mk(size.x / 2, size.y / 2), rtB: mk(size.x / 2, size.y / 2),
    o,
    px: o.spread / (size.x / 2),
    blurQ: _bloomQuad(THREE, `varying vec2 vUv; uniform sampler2D tex; uniform vec2 dir;
void main(){ vec4 s = texture2D(tex,vUv)*0.227027;
s+=texture2D(tex,vUv+dir*1.3846)*0.3162162; s+=texture2D(tex,vUv-dir*1.3846)*0.3162162;
s+=texture2D(tex,vUv+dir*3.2308)*0.0702703; s+=texture2D(tex,vUv-dir*3.2308)*0.0702703;
gl_FragColor = s; }`, { tex: { value: null }, dir: { value: new THREE.Vector2() } }),
    compQ: _bloomQuad(THREE, `varying vec2 vUv; uniform sampler2D base;
uniform sampler2D glow; uniform float k; uniform float sat;
vec3 aces(vec3 c){ return clamp(c*(2.51*c+0.03)/(c*(2.43*c+0.59)+0.14), 0., 1.); }
void main(){ vec4 b = texture2D(base,vUv); vec4 g = texture2D(glow,vUv);
float l = dot(g.rgb, vec3(0.299,0.587,0.114));
vec3 gs = clamp(mix(vec3(l), g.rgb, sat), 0., 8.);
vec3 col = b.rgb + gs*k; float a = clamp(b.a + g.a*k*0.9, 0., 1.);
col = aces(col); col = pow(col, vec3(1./2.2));
gl_FragColor = vec4(col, a); }`,
      { base: { value: null }, glow: { value: null },
        k: { value: o.k }, sat: { value: o.sat } }),   // glow-lift hots = Jared's "turn them all up a LOT" (8/9)
  };
}

function ensureModelRes(sc, scale, held) {
  // ADAPTIVE RESOLUTION (Build 1.9, Jared's "low resolution" catch):
  // the canvas re-renders at the size it's actually displayed — a
  // stretched hologram renders AT screen resolution instead of blowing
  // up a fixed 480px bitmap (and OBS's 1x-density browser stops being
  // half the tracker's sharpness). Resizes only on SETTLE (never mid-
  // grip — RT reallocation would hitch the stretch), 25% hysteresis,
  // 2048 cap, never below the 480 base (minis stay supersampled).
  if (held || !sc.bufSize) return;
  const want = Math.round(Math.min(2048, Math.max(MODEL_PX,
    MODEL_PX * (devicePixelRatio || 1) * SS * (scale || 1))));
  if (Math.abs(want - sc.bufSize) / sc.bufSize < 0.25) return;
  sc.bufSize = want;
  sc.renderer.setPixelRatio(1);
  sc.renderer.setSize(want, want, false);   // CSS stays 480 (stylesheet)
  if (sc.post) {                            // bloom rig rebuilt to match
    [sc.post.rtScene, sc.post.rtA, sc.post.rtB].forEach(rt => rt.dispose());
    [sc.post.blurQ, sc.post.compQ].forEach(q => { q.g.dispose(); q.m.dispose(); });
    sc.post = buildBloomRig(sc.THREE, sc.renderer, sc.post.o);
  }
}

function renderModelScene(sc) {
  const r = sc.renderer, p = sc.post;
  if (sc.ghostMat)
    // THE SCAN BEAM loop: phase climbs the model's own height per
    // ~6s cycle (the shader wraps it — no gap, ever). Wall-clock
    // phase so the tracker and the OBS overlay pulse in sync.
    sc.ghostMat.uniforms.uBeam.value =
      ((Date.now() % 6000) / 6000) * sc.ghostMat.beamSpan;
  if (!p) { r.render(sc.scene, sc.camera); return; }
  r.setRenderTarget(p.rtScene); r.render(sc.scene, sc.camera);
  const bu = p.blurQ.m.uniforms;
  bu.tex.value = p.rtScene.texture; bu.dir.value.set(p.px, 0);
  r.setRenderTarget(p.rtA); r.render(p.blurQ.s, p.blurQ.cam);
  bu.tex.value = p.rtA.texture; bu.dir.value.set(0, p.px);
  r.setRenderTarget(p.rtB); r.render(p.blurQ.s, p.blurQ.cam);
  bu.tex.value = p.rtB.texture; bu.dir.value.set(p.px * 2, 0);
  r.setRenderTarget(p.rtA); r.render(p.blurQ.s, p.blurQ.cam);
  bu.tex.value = p.rtA.texture; bu.dir.value.set(0, p.px * 2);
  r.setRenderTarget(p.rtB); r.render(p.blurQ.s, p.blurQ.cam);
  bu.tex.value = p.rtB.texture; bu.dir.value.set(p.px * 3, 0);
  r.setRenderTarget(p.rtA); r.render(p.blurQ.s, p.blurQ.cam);
  bu.tex.value = p.rtA.texture; bu.dir.value.set(0, p.px * 3);
  r.setRenderTarget(p.rtB); r.render(p.blurQ.s, p.blurQ.cam);
  p.compQ.m.uniforms.base.value = p.rtScene.texture;
  p.compQ.m.uniforms.glow.value = p.rtB.texture;
  r.setRenderTarget(null); r.render(p.compQ.s, p.compQ.cam);
}

function loadThree() {
  if (!_three) _three = Promise.all([
    import("three"),
    import("three/addons/loaders/GLTFLoader.js"),
    import("three/addons/environments/RoomEnvironment.js"),
  ]).then(([T, L, E]) => ({ THREE: T, GLTFLoader: L.GLTFLoader,
                            RoomEnvironment: E.RoomEnvironment }));
  return _three;
}

async function buildModelScene(el, src, mm, lift) {
  try {
    const { THREE, GLTFLoader, RoomEnvironment } = await loadThree();
    const canvas = el.querySelector("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true,
                                               antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(MODEL_PX, MODEL_PX, false);
    // ACES film curve on the plain path (a blown-out-highlights
    // catch): highlights roll off instead of clipping. Canvas
    // renders only — the bloom path renders to RTs (which skip tone
    // mapping) and does its own ACES in the composite; no double-dip.
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
    camera.position.set(0, 0, 3.2);
    const gltf = await new GLTFLoader().loadAsync(src);
    const obj = gltf.scene;
    let nLift = 0, ghostMat = null;
    // SKELETON-AWARE LOAD (an AI-generated model's export-skeleton
    // cut-off catch): skinned meshes store BIND-POSE geometry — the
    // real shape only exists after the bones pose it. So: measure with
    // the strings pulled, and NEVER let the culler eat a puppet (the
    // old guard only ran when animation clips arrived — a skeleton
    // with missing clips slipped through and vanished piecewise).
    obj.updateMatrixWorld(true);
    obj.traverse(n => { if (n.isSkinnedMesh) n.frustumCulled = false; });
    const box = new THREE.Box3();
    // THE ENVELOPE CACHE (round 4 — Jared: "slight delay... I guess
    // that's the tradeoff"; refunded): the measured performance
    // envelope is remembered per file, so the invisible rehearsal
    // below runs ONCE per model per browser — every later load reads
    // the box instantly.
    const bkey = "barehands-box:" + src;
    let cachedBox = null;
    try { cachedBox = JSON.parse(localStorage.getItem(bkey) || "null"); }
    catch (e) {}
    if (cachedBox && cachedBox.min && cachedBox.max) {
      box.min.fromArray(cachedBox.min);
      box.max.fromArray(cachedBox.max);
    } else {
      try {
        obj.traverse(n => {
          if (!n.isMesh) return;
          if (n.isSkinnedMesh) {
            n.skeleton.update();
            n.computeBoundingBox();
            if (n.boundingBox)
              box.union(n.boundingBox.clone().applyMatrix4(n.matrixWorld));
          } else {
            box.expandByObject(n);
          }
        });
      } catch (e) {}
      // belt + suspenders (round 2): union the skeleton-posed box with
      // the plain measurement — whichever method sees more body wins
      try { box.union(new THREE.Box3().setFromObject(obj)); } catch (e) {}
      // round 3 ("it's still catching"): the ANIMATION escapes any
      // load-pose snapshot — play every clip invisibly and union a
      // dozen sampled frames each; the box becomes the true envelope
      // of the whole performance
      try {
        if (gltf.animations && gltf.animations.length) {
          const probe = new THREE.AnimationMixer(obj);
          for (const clip of gltf.animations) {
            const act = probe.clipAction(clip);
            act.play();
            const N = 12;
            for (let i = 0; i <= N; i++) {
              probe.setTime(clip.duration * i / N || 0);
              obj.updateMatrixWorld(true);
              obj.traverse(n => {
                if (!n.isSkinnedMesh) return;
                n.skeleton.update();
                n.computeBoundingBox();
                if (n.boundingBox)
                  box.union(n.boundingBox.clone().applyMatrix4(n.matrixWorld));
              });
            }
            act.stop();
          }
          probe.stopAllAction();
        }
      } catch (e) {}
      try {
        if (!box.isEmpty())
          localStorage.setItem(bkey, JSON.stringify(
            { min: box.min.toArray(), max: box.max.toArray() }));
      } catch (e) {}
    }
    if (box.isEmpty()) box.setFromObject(obj);
    obj.position.sub(box.getCenter(new THREE.Vector3()));
    const bsz = box.getSize(new THREE.Vector3());
    // THE EXPLODE RIG (inspired by a viral exploded-car web demo):
    // the model is now centered at the origin, so
    // every part's world center IS its outward flight direction. Parts
    // sorted big-to-small for the stagger — panels leave first, small
    // parts trail, which is what reads as engineered instead of
    // detonated. Works on any parted GLB; a fused model just has one
    // part and nothing visibly happens.
    const exParts = [];
    try {
      obj.updateMatrixWorld(true);
      const _pb = new THREE.Box3(), _pc = new THREE.Vector3();
      obj.traverse(n => {
        if (!n.isMesh || n.isSkinnedMesh) return;
        try { _pb.setFromObject(n); } catch (e) { return; }
        if (_pb.isEmpty()) return;
        _pb.getCenter(_pc);
        const dir = _pc.clone();
        if (dir.length() < 1e-4) dir.set(0, 1, 0);
        dir.normalize();
        exParts.push({ n, home: n.position.clone(), dir,
                       size: _pb.getSize(new THREE.Vector3()).length() });
      });
      exParts.sort((a, b) => b.size - a.size);
      exParts.forEach((p, i) => {
        p.lag = exParts.length > 1 ? 0.35 * i / (exParts.length - 1) : 0;
      });
    } catch (e) {}
    const exSpread = (bsz.length() || 1) * 0.55;
    // 1.3 fit (was 1.7): real breathing room inside the square render
    // window, so animation strides and pose swings don't overflow its
    // edges — models rest smaller, and stretching covers the rest
    const fit = 1.3 / (bsz.length() || 1);
    const group = new THREE.Group();
    group.scale.setScalar(fit);
    group.add(obj);
    scene.add(group);
    let mixer = null;
    if (gltf.animations && gltf.animations.length) {
      // animated GLBs: play every clip — downloaded props often
      // split one logical animation across clips. Skinned meshes lose frustum culling (the bind-pose
      // bounding-box vanishing bug).
      mixer = new THREE.AnimationMixer(obj);
      gltf.animations.forEach(cl => mixer.clipAction(cl).play());
    }
    if (mm === "holo") {
      // THE GHOST GLASS (modeled on a hologram-style AI-render
      // reference, harness-matched): fresnel rim
      // shader — translucent teal volume, X-ray interior, silhouettes
      // burning bright for the bloom to catch. Skinning chunks included
      // so animated models wear it too. (Replaces the v1 triangle
      // wireframe — dense meshes rendered as blue soup.)
      const ghost = new THREE.ShaderMaterial({
        uniforms: {
          cBase: { value: new THREE.Color(0.40, 0.75, 0.71) },
          cRim:  { value: new THREE.Color(0.75, 1.0, 0.96) },
          rimPow: { value: 3.2 }, baseA: { value: 0.12 },
          rimA: { value: 0.8 }, boost: { value: 1.4 },
          uBeam: { value: 0.0 }, uBeamW: { value: 0.0375 },
          uSpan: { value: Math.max(bsz.y * fit, 0.2) },
        },
        vertexShader: `
          #include <common>
          #include <skinning_pars_vertex>
          varying vec3 vN; varying vec3 vV; varying float vWy;
          void main() {
            #include <skinbase_vertex>
            #include <beginnormal_vertex>
            #include <skinnormal_vertex>
            #include <begin_vertex>
            #include <skinning_vertex>
            vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
            vN = normalize(normalMatrix * objectNormal);
            vV = normalize(-mv.xyz);
            vWy = mv.y;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform vec3 cBase; uniform vec3 cRim;
          uniform float rimPow; uniform float baseA;
          uniform float rimA; uniform float boost;
          uniform float uBeam; uniform float uBeamW; uniform float uSpan;
          varying vec3 vN; varying vec3 vV; varying float vWy;
          void main() {
            float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), rimPow);
            vec3 col = mix(cBase, cRim, f) * (0.5 + f * boost);
            float a = clamp(baseA + f * rimA, 0.0, 1.0);
            // THE SCAN BEAM v2 (Jared's tweaks 8/9: half-height band,
            // gentle heat, and CYCLIC in space — wrapped distance over
            // the model's own height, so as the band leaves the head
            // its twin is already rising from the feet; a beam is
            // always alive on the model, by construction)
            float y = vWy + uSpan * 0.5;
            float d = mod(y - uBeam, uSpan);
            d = min(d, uSpan - d);
            float b = exp(-pow(d / uBeamW, 2.0));
            col += cRim * b * (0.3 + f * 0.7);
            a = clamp(a + b * 0.16, 0.0, 1.0);
            gl_FragColor = vec4(col, a);
          }`,
        transparent: true, depthWrite: false, side: THREE.DoubleSide });
      obj.traverse(n => { if (n.isMesh) n.material = ghost; });
      ghostMat = ghost;
      ghostMat.beamSpan = Math.max(bsz.y * fit, 0.2);
    } else {
      // solid: environment lighting so PBR textures read true (bare
      // directional lights leave metallic GLBs near-black).
      // (a real-car-model catch: "very bright and blown out" —
      // saturated car paint was reading silver-white): the
      // full stack was overdriving PBR paint — exposure eased, key
      // and ambient trimmed, env reflections damped on materials
      // that carry an envMapIntensity dial.
      renderer.toneMappingExposure = 0.82;
      scene.environment = new THREE.PMREMGenerator(renderer)
        .fromScene(new RoomEnvironment(), 0.04).texture;
      scene.add(new THREE.AmbientLight(0xffffff, 0.28));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 3, 4);
      scene.add(key);
      obj.traverse(n => {
        if (!n.isMesh) return;
        const ms = Array.isArray(n.material) ? n.material : [n.material];
        ms.forEach(m => {
          if (m && "envMapIntensity" in m) m.envMapIntensity = 0.65;
        });
      });
      nLift = liftTranslucentArt(obj, THREE, lift);
      if (nLift && ROLE !== "render")
        toast(`glow lift: ${nLift} material${nLift > 1 ? "s" : ""}`, 1800);
    }
    const post = mm === "holo"
      ? buildBloomRig(THREE, renderer, { k: 0.85, sat: 1.0, spread: 2.2 })
      : nLift ? buildBloomRig(THREE, renderer, { k: 2.2, sat: 2.6, spread: 2.6 })
      : null;
    return { renderer, scene, camera, group, canvas, mixer, post, THREE, ghostMat,
             exParts, exSpread, exC: 0,
             bufSize: Math.round(MODEL_PX * Math.min(devicePixelRatio || 1, 2)) };
  } catch (e) {
    _three = null;                          // let a retry re-import
    if (ROLE !== "render")
      toast("3D failed: " + (e.message || "load error"), 3000);
    return null;
  }
}

function disposeScene(sc) {
  try {
    if (sc.mixer) sc.mixer.stopAllAction();
    if (sc.post) {
      [sc.post.rtScene, sc.post.rtA, sc.post.rtB].forEach(rt => rt.dispose());
      [sc.post.blurQ, sc.post.compQ].forEach(q => { q.g.dispose(); q.m.dispose(); });
    }
    sc.scene.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      (Array.isArray(n.material) ? n.material : n.material ? [n.material] : [])
        .forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    });
    sc.renderer.dispose();
  } catch (e) {}
}

function makeModel(src, title, mode, lift) {
  const mm = modelModeFor(src, mode);
  const el = document.createElement("div");
  el.className = "card modelcard" + (mm === "holo" ? " holo" : "");
  el.innerHTML = `<canvas></canvas>`;
  closable(el);
  BEHIND.appendChild(el);
  const it = { el, id: UID++, type: "model",
    def: { title: title || "", file: "", src, mmode: mm, lift },
    x: innerWidth * 0.5, y: innerHeight * 0.42, scale: 1,
    rx: -0.15, ry: 0.6, rz: 0, rvy: 0, vx: 0, vy: 0,
    grabbedBy: [], ox: 0, oy: 0, flying: false, stretch: null };
  buildModelScene(el, src, mm, lift).then(sc => {
    if (sc) {
      sc.it = it; MSCENES.set(it.id, sc);
      if (sc.exParts && sc.exParts.length > 2) it.exCap = 1;
    }
  });
  return it;
}

function applyExplode(sc, tgt) {
  // both pages ease toward the mirrored TARGET with the same constant,
  // so tracker and broadcast bloom in visual lockstep (~2s to open)
  if (!sc.exParts || !sc.exParts.length) return;
  const cur = sc.exC || 0;
  if (Math.abs(tgt - cur) < 0.001 && cur === 0) return;
  sc.exC = Math.abs(tgt - cur) < 0.001 ? tgt : cur + (tgt - cur) * 0.022;
  for (const p of sc.exParts) {
    let f = (sc.exC - p.lag) / (1 - p.lag || 1);
    f = Math.max(0, Math.min(1, f));
    f = f * f * (3 - 2 * f);               // smoothstep — eased flight
    p.n.position.copy(p.home).addScaledVector(p.dir, f * sc.exSpread);
  }
}

function renderModels() {
  MSCENES.forEach((sc, id) => {
    if (!sc.it.el.isConnected) {
      disposeScene(sc); MSCENES.delete(id); return;
    }
    sc.group.rotation.x = sc.it.rx || 0;
    sc.group.rotation.y = sc.it.ry || 0;
    sc.group.rotation.z = sc.it.rz || 0;
    applyExplode(sc, sc.it.ex || 0);
    if (sc.mixer) {
      const mnow = performance.now();
      sc.mixer.update(Math.min((mnow - (sc.mt || mnow)) / 1000, 0.05));
      sc.mt = mnow;
    }
    ensureModelRes(sc, sc.it.scale, sc.it.grabbedBy.length > 0);
    renderModelScene(sc);
  });
}

// board commands from the server (the assistant's hands on the
// board). The AGENCY verbs: hand = deliver an item to the user's
// reach; yank = TAKE something back (grip-fight shake, then ripped
// away off-screen); hover = pulse for attention.
let lastTouchedId = null;

function findItem(title) {
  if (title) {
    const t = title.toLowerCase();
    const f = items.find(i => (i.def.title || "").toLowerCase().includes(t) ||
                              (i.def.src || "").toLowerCase().includes(t));
    if (f) return f;
  }
  return items.find(i => i.grabbedBy.length) ||
         items.find(i => i.id === lastTouchedId) ||
         items[items.length - 1];
}

function deliver(c) {
  // GLASS ERA (Jared's law 8/13: "no more throwing me stuff from the
  // side of the screen") — deliveries MATERIALIZE at his reach: the
  // in-bloom (back-ease scale + 3D turn-in), zero side travel
  c.x = innerWidth * 0.62; c.y = innerHeight * 0.46;
  c.anim = { k: "in", t: 0 };
  c.el.style.opacity = "0.05";
}

function give(c) {
  // "<<do:give>>" (2026-08-14, Jared: "put something in my hand"):
  // materialize at the reach, then the force-pull flight INTO his
  // live hand — lands caught-and-held, the same SMACK as the claw
  // pull. Hands off camera = the plain reach-offer above.
  deliver(c);
  const ci = Object.keys(cursors)[0];
  if (ci != null) c.anim = { k: "give", t: 0, ci: +ci };
}

function applyCmds(cmds) {
  (cmds || []).forEach(c => {
    if (c.a === "clear") {
      items.forEach(killItem);          // scorched earth — ring included
    } else if (c.a === "reset") {
      // Jared's law (2026-08-13): reset = the GATHER — board swept,
      // THE RING materializes center stage (the arms-together state);
      // clear = literally everything off, the ring included
      loadTree().then(() => spawnStage(0.5, 0.42));
    } else if (c.a === "explode" || c.a === "assemble") {
      // THE EXPLODE verbs (2026-08-14): title-match first, else the
      // freshest model on the board; assemble snaps the flight home
      let t = c.title ? findItem(c.title) : null;
      if (!t || t.type !== "model")
        t = items.filter(k => k.type === "model" && k.el.isConnected).pop();
      if (t) { t.ex = c.a === "explode" ? 1 : 0; lastTouchedId = t.id; }
    } else if (c.a === "add_img" || c.a === "hand" || c.a === "give") {
      const it = isModelSrc(c.src) ? makeModel(c.src, c.title, c.mode, c.lift)
                                   : makeImage(c.src, c.title);
      if (c.a === "give") give(it);
      else if (c.a === "hand") deliver(it);
      else { it.anim = { k: "in", t: 0 }; it.el.style.opacity = "0.05"; }
      items.push(it);
    } else if (c.a === "add_card" && c.title) {
      // the note-throw: add_card carries an optional notes `file` —
      // the delivered card flash-opens into the full note (the /note
      // jail governs, so only configured notes folders resolve).
      // open:1 = unfurl the panel immediately instead of the card.
      const it = makeCard({ title: c.title, body: c.body || "",
                            file: c.file || "" });
      if (c.hand) deliver(it);
      else {
        // Optional x/y, as 0..1 fractions of the viewport -- the same
        // convention /state already reports positions in, so what you
        // read back is what you can send. Without them the old centre
        // is kept, so nothing that worked before moves. Clamped, because
        // a card at 1.4 is a card nobody can reach to drag back.
        const nx = typeof c.x === "number" ? c.x : 0.5;
        const ny = typeof c.y === "number" ? c.y : 0.4;
        it.x = Math.min(0.92, Math.max(0.08, nx)) * innerWidth;
        it.y = Math.min(0.92, Math.max(0.08, ny)) * innerHeight;
        it.anim = { k: "in", t: 0 }; it.el.style.opacity = "0.05";
      }
      items.push(it);
      if (c.open && it.def.file) openPanel(it);
    } else if (c.a === "widget") {
      summonWidget(c.w || "ring");
    } else if (c.a === "scroll_note") {
      // the assistant as teleprompter operator: glides the newest note
      const p = items.filter(k => k.type === "panel").pop();
      if (p && p.body) {
        const box = p.body.parentElement.clientHeight;
        const maxS = Math.max(0, p.body.offsetHeight - box + 40);
        p.sTarget = c.dir === "top" ? 0 : Math.min(maxS, Math.max(0,
          (p.sTarget ?? p.scrollY ?? 0) + (c.dir === "up" ? -1 : 1) * box * 0.8));
      }
    } else if (c.a === "yank") {
      const t = findItem(c.title);
      if (t) {
        t.grabbedBy.forEach(i => { if (cursors[i]) cursors[i].el.classList.remove("pinched"); });
        t.grabbedBy = []; t.el.classList.remove("grabbed");
        t.flying = false; t.stretch = null;
        t.anim = { k: "yank", t: 0 };
        foley.yank();
      }
    } else if (c.a === "hover") {
      const t = findItem(c.title);
      if (t) t.anim = { k: "hover", t: 0 };
    } else if (c.a === "present") {
      // THE PRESENT verb: show-and-tell. Stage (or find) the thing, fly
      // it center stage, enlarge it, dim everything else. Ends when the
      // person grabs it, it leaves the board, or a new present/clear.
      let t = c.title ? findItem(c.title) : null;
      if (!t && c.src) {
        t = isModelSrc(c.src) ? makeModel(c.src, c.title, c.mode, c.lift)
                              : makeImage(c.src, c.title);
      } else if (!t && c.title) {
        t = makeCard({ title: c.title, body: c.body || "", file: c.file || "" });
      }
      if (t) {
        if (!items.includes(t)) {
          t.x = innerWidth * 0.5; t.y = innerHeight * 0.44;
          t.el.style.opacity = "0.05";
          items.push(t);
        }
        if (c.open && t.def && t.def.file) {
          openPanel(t);
          const p = items.filter(k => k.type === "panel").pop();
          presentItem(p || t);
        } else presentItem(t);
      }
    }
  });
}

// ---- THE PRESENT machinery: one spotlit item, everything else dims.
let presented = null;
function presentItem(t) {
  if (presented && presented !== t) endPresent();
  presented = t;
  const el = t.el;
  // size-aware target scale: land filling roughly half the short axis
  const w = el.offsetWidth || 320, h = el.offsetHeight || 220;
  const s1 = Math.min(2.4, Math.max(1.25,
    (Math.min(innerWidth, innerHeight) * 0.55) / Math.max(w, h)));
  t.anim = { k: "present", t: 0, x0: t.x, y0: t.y, s0: t.scale || 1, s1 };
  BEHIND.appendChild(el);                       // pop to the top, pull-catch style
  el.classList.add("presented");
  items.forEach(k => {
    if (k !== t && k.el && k.el.isConnected) k.el.classList.add("dimmed");
  });
}
function endPresent() {
  if (!presented) return;
  items.forEach(k => { if (k.el) k.el.classList.remove("dimmed"); });
  presented.el.classList.remove("presented");
  if (presented.anim && presented.anim.k === "present") presented.anim = null;
  presented = null;
}

// ---- THE ORBITAL BLOOM: the board boots EMPTY except THE RING.
// Tap the ring → the configured folders bloom as glass ORBS around it
// (fat circular tap targets); tap an orb → its browser pane grows
// FROM the orb's spot; tap the ring again → the orbs retract.
// Every plane -- mouse, finger, head -- activates a station through here,
// so the three can never drift apart on what a station does.
function orbActivate(c) {
  const d = c.def || {};
  if (d.menu === "settings") return openSettings();
  if (d.orb === null || d.orb === undefined) {
