// ============================================================
// NOVROS WIDGETS -- clock, date, weather
// ------------------------------------------------------------
// They are ordinary board items, so every control plane already moves,
// scales and closes them with no special cases. They live in the Apps
// station, they wear the current theme because they are built from the
// same CSS variables, and which ones you had open survives a reload.
// Weather comes from Open-Meteo, which needs no key and speaks CORS, so
// nothing has to go through the server for it.
// ============================================================
const WDG_KINDS = {
  clock:   { title: "Clock",   body: "analogue face" },
  date:    { title: "Date",    body: "day and month" },
  weather: { title: "Weather", body: "now and next hours" },
  news:    { title: "News",    body: "UK and world headlines" },
  terminal:{ title: "Terminal", body: "the stream, scrolling" },
};

// RSS carries no CORS headers, so the server fetches the feeds and this
// reads its JSON. Versioned rather than time-checked: the widget repaint
// runs every second, and rebuilding the strip that often would restart
// the scroll animation on every tick.
const NEWSDATA = { items: [], v: 0, t: 0, busy: false };
async function fetchNews() {
  if (NEWSDATA.busy || Date.now() - NEWSDATA.t < 300000) return;
  NEWSDATA.busy = true;
  try {
    const j = await (await fetch("/news", { cache: "no-store" })).json();
    if (j.items && j.items.length) {
      NEWSDATA.items = j.items; NEWSDATA.v++; NEWSDATA.t = Date.now();
    }
  } catch {}
  NEWSDATA.busy = false;
}
const WX_CODE = {
  0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",
  51:"Light drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",
  65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",
  73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",
  82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",
  96:"Thunderstorm",99:"Thunderstorm",
};

function widgetState() {
  try { return JSON.parse(localStorage.getItem("novros-widgets") || "[]"); }
  catch { return []; }
}
function saveWidgets() {
  const live = items.filter(i => i.type === "wdg" && i.el.isConnected)
    .map(i => ({ k: i.wkind,
                 x: +(i.x / innerWidth).toFixed(4),
                 y: +(i.y / innerHeight).toFixed(4),
                 s: +(i.scale || 1).toFixed(3) }));
  try { localStorage.setItem("novros-widgets", JSON.stringify(live)); } catch {}
}

function makeWidget(kind) {
  const el = document.createElement("div");
  el.className = `card wdg ${kind}w`;
  el.innerHTML = `<div class="win"></div>`;
  // no close button on a widget: it is furniture, not a window, and the
  // Widgets station toggles it off the same way it put it on
  BEHIND.appendChild(el);
  const w = { el, id: UID++, type: "wdg", wkind: kind,
              def: { title: WDG_KINDS[kind].title, file: "" },
              x: innerWidth * 0.5, y: innerHeight * 0.5, scale: 1, vx: 0, vy: 0,
              grabbedBy: [], ox: 0, oy: 0, flying: false, stretch: null };
  items.push(w);
  paintWidget(w);
  return w;
}

function toggleWidget(kind, x, y) {
  const ex = items.find(i => i.type === "wdg" && i.wkind === kind && i.el.isConnected);
  if (ex) { killItem(ex); setTimeout(saveWidgets, 60); return; }
  const w = makeWidget(kind);
  if (x != null) { w.x = x; w.y = y; }
  w.anim = { k: "in", t: 0 }; w.el.style.opacity = "0.05";
  saveWidgets();
}

function restoreWidgets() {
  widgetState().forEach(st => {
    if (!WDG_KINDS[st.k]) return;
    const w = makeWidget(st.k);
    w.x = (st.x ?? 0.5) * innerWidth;
    w.y = (st.y ?? 0.5) * innerHeight;
    w.scale = st.s || 1;
    w.anim = { k: "in", t: 0 }; w.el.style.opacity = "0.05";
  });
}

// ---- weather, fetched once and refreshed on the quarter hour ----
const WX = { data: null, place: "", t: 0, busy: false };
async function fetchWeather() {
  if (WX.busy || Date.now() - WX.t < 900000) return;
  WX.busy = true;
  try {
    let lat = null, lon = null;
    try {
      const j = await (await fetch("https://ipapi.co/json/")).json();
      lat = j.latitude; lon = j.longitude; WX.place = j.city || j.region || "";
    } catch {}
    if (lat == null) { WX.busy = false; return; }
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code` +
      `&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`;
    WX.data = await (await fetch(u)).json();
    WX.t = Date.now();
  } catch {}
  WX.busy = false;
}

function paintWidget(w) {
  const box = w.el.firstElementChild;
  const now = new Date();
  if (w.wkind === "date") {
    // trimmed to three letters so the head row is always the same width
    // (en-GB returns "Sept", which threw the alignment out)
    const dy = now.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3);
    const mo = now.toLocaleDateString(undefined, { month: "short" }).slice(0, 3);
    box.innerHTML =
      `<div class="dhead"><span class="dday">${escT(dy)}</span>` +
      `<span class="dmon">${escT(mo)}</span></div>` +
      `<div class="dnum">${now.getDate()}</div>`;
    return;
  }
  if (w.wkind === "clock") {
    let cv = box.querySelector("canvas");
    if (!cv) { box.innerHTML = ""; cv = document.createElement("canvas");
               cv.width = cv.height = 320; cv.style.width = cv.style.height = "158px";
               box.appendChild(cv); }
    drawClock(cv, now);
    return;
  }
  if (w.wkind === "terminal") {
    if (!w.term) {
      box.innerHTML = "";
      const cv = document.createElement("canvas");
      cv.width = 760; cv.height = 520;
      cv.style.width = "380px"; cv.style.height = "260px";
      box.appendChild(cv);
      w.term = { cv, lines: [], off: 0, last: 0, rate: 260 };
      for (let k = 0; k < 24; k++) w.term.lines.push(termLine());
      // its own loop: the widget repaint is once a second, and a stream
      // that moves once a second is a slideshow
      const spin = now => {
        if (!w.el.isConnected) return;
        drawTerminal(w.term.cv, w.term, now);
        requestAnimationFrame(spin);
      };
      requestAnimationFrame(spin);
    }
    if (NEWSDATA.items.length < 2) fetchNews();
    return;
  }
  if (w.wkind === "news") {
    if (!NEWSDATA.items.length) {
      box.innerHTML = `<div class="wlbl">Live news</div>
        <div class="wsm" style="padding:10px 20px 0">fetching headlines\u2026</div>`;
      return;
    }
    // rebuild when the headlines change OR the pace does, so a speed
    // change lands without waiting for the next refresh
    const dur = Math.max(120, NEWSDATA.items.length * TUNE.newsPace);
    if (w.newsV === NEWSDATA.v && w.newsDur === dur) return;
    w.newsDur = dur;
    w.newsV = NEWSDATA.v;
    const strip = NEWSDATA.items.map(i =>
      `<b>${escT(i.s)}</b>${escT(i.t)}`).join('<i>\u2022</i>');
    box.innerHTML = `<div class="wlbl">Live news</div>
      <div class="nwin"><div class="ntrack" style="animation-duration:${dur}s">
        <span>${strip}</span><span>${strip}</span></div></div>`;
    return;
  }
  if (w.wkind === "weather") {
    const d = WX.data;
    if (!d || !d.current) {
      box.innerHTML = `<div class="wlbl">Weather</div><div class="wsm" style="margin-top:10px">
        locating…</div>`;
      return;
    }
    const t = Math.round(d.current.temperature_2m);
    const cond = WX_CODE[d.current.weather_code] || "—";
    const hi = Math.round(d.daily.temperature_2m_max[0]);
    const lo = Math.round(d.daily.temperature_2m_min[0]);
    const hrs = [];
    const nowH = now.getHours();
    for (let k = 0; k < d.hourly.time.length && hrs.length < 6; k++) {
      const hh = new Date(d.hourly.time[k]).getHours();
      if (new Date(d.hourly.time[k]) > now || (hh === nowH && hrs.length))
        hrs.push({ h: hh, t: Math.round(d.hourly.temperature_2m[k]) });
    }
    box.innerHTML =
      `<div style="display:flex;justify-content:space-between;align-items:flex-start">
         <div><div class="wlbl">${escT(WX.place || "Here")}</div>
              <div class="wbig">${t}&deg;</div></div>
         <div style="text-align:right"><div class="wmid">${escT(cond)}</div>
              <div class="wsm">H:${hi}&deg;  L:${lo}&deg;</div></div>
       </div>
       <div class="strip">${hrs.map(o =>
          `<div><div class="h">${String(o.h).padStart(2,"0")}</div>
                <div class="t">${o.t}&deg;</div></div>`).join("")}</div>`;
  }
}

function drawClock(cv, now) {
  const x = cv.getContext("2d"), R = 160;
  const css = getComputedStyle(document.documentElement);
  const c = n => `rgb(${(css.getPropertyValue(n) || "140,240,225").trim()})`;
  x.clearRect(0, 0, 320, 320);
  x.save(); x.translate(R, R);
  x.strokeStyle = c("--c33"); x.lineWidth = 3; x.globalAlpha = 0.5;
  x.beginPath(); x.arc(0, 0, 146, 0, 7); x.stroke(); x.globalAlpha = 1;
  for (let i = 0; i < 60; i++) {                 // the minute track
    const a = i * Math.PI / 30, big = i % 5 === 0;
    x.globalAlpha = big ? 0.9 : 0.34;
    x.strokeStyle = c("--c39"); x.lineWidth = big ? 4 : 2;
    x.beginPath();
    x.moveTo(Math.sin(a) * (big ? 118 : 128), -Math.cos(a) * (big ? 118 : 128));
    x.lineTo(Math.sin(a) * 138, -Math.cos(a) * 138);
    x.stroke();
  }
  x.globalAlpha = 1;
  const hand = (ang, len, wid, col, alpha) => {
    x.globalAlpha = alpha; x.strokeStyle = col; x.lineWidth = wid;
    x.lineCap = "round"; x.beginPath(); x.moveTo(0, 0);
    x.lineTo(Math.sin(ang) * len, -Math.cos(ang) * len); x.stroke();
  };
  const h = now.getHours() % 12, m = now.getMinutes(), sec = now.getSeconds();
  hand((h + m / 60) * Math.PI / 6, 74, 10, c("--c41"), 0.97);
  hand((m + sec / 60) * Math.PI / 30, 112, 7, c("--c41"), 0.97);
  hand(sec * Math.PI / 30, 124, 3, c("--c33"), 0.95);
  x.fillStyle = c("--c33"); x.beginPath(); x.arc(0, 0, 8, 0, 7); x.fill();
  x.restore();
}

// degrees apart, starting straight up. The hand-written angles this

// else, so the ring read as lopsided.
const NOV_ORDER = ["apps", "projects", "settings", "games", "demos", "documents"];
const NOV_TITLES = { apps: "Widgets", projects: "Projects", settings: "Settings",
                     games: "Games", demos: "Demos", documents: "Documents" };
const NOV_MENU = NOV_ORDER.map((menu, i) => ({
  title: NOV_TITLES[menu],
  ang: -Math.PI / 2 + i * (Math.PI * 2 / NOV_ORDER.length),
  menu,
}));

// What each station is wired to. Documents and Demos ride the folders
// barehands.json already configures; the rest are stations waiting for
// a source, and say so rather than failing silently.
function novStation(m) {
  const notesIdx = (CFG.orbs || []).findIndex(o => o.kind !== "media");
  const propsIdx = (CFG.orbs || []).findIndex(o => o.kind === "media");
  if (m === "documents" && notesIdx >= 0) {
    const v = treeCounts(TREES[notesIdx], false);
    return { orb: notesIdx, body: `${v.dirs} folders · ${v.leaves} notes` };
  }
  if (m === "demos" && propsIdx >= 0) {
    const p = treeCounts(PROPSTREE, true);
    return { orb: "props", body: `${p.dirs} folders · ${p.leaves} props` };
  }
  if (m === "apps") return { orb: "apps", body: "clock · date · weather · news" };
  if (m === "games") return { orb: "games", body: "tetris · invaders · pac-man" };
  if (m === "projects") return { orb: "shapes", body: "live procedural 3D" };
  if (m === "settings") return { orb: null, body: "input & controls" };
  return { orb: null, body: "empty" };
}

function ringToggle(ring) {
  const up = items.filter(i => i.type === "orb" && i.el.isConnected);
  if (up.length) { up.forEach(killItem); return; }
  const defs = NOV_MENU.map(m => {
    const st = novStation(m.menu);
    return { title: m.title, ang: m.ang, menu: m.menu,
             orb: st.orb, body: st.body };
  });
  defs.forEach((def, i) => {
    def.side = 1;                      // full circle: the angle carries it
    const o = makeOrb(def);
    // the ORBITAL CONSTRAINT in physics() owns their position from
    // here — spawn at the current target so the bloom lands true
    const R = orbitR(ring.scale || 1, o.scale || 1);
    o.x = ring.x + Math.cos(def.ang) * R;
    o.y = ring.y + Math.sin(def.ang) * R;
    o.anim = { k: "in", t: 0, d: i * 0.07 };       // staggered bloom
    o.el.style.opacity = "0.05";
    items.push(o);
  });
}

let CFG = { name: "Assistant", orbs: [] };
let TREES = [], PROPSTREE = null;
async function loadTree() {
  // barehands.json drives everything: the ring's name and one orb per
  // configured folder (kind "notes" = a markdown tree, "media" = props)
  try { const r = await fetch("/config"); if (r.ok) CFG = await r.json(); }
  catch (e) {}
  TREES = [];
  for (let i = 0; i < (CFG.orbs || []).length; i++) {
    TREES[i] = null;
    if (CFG.orbs[i].kind === "media") continue;
    try { const r = await fetch("/tree?orb=" + i);
          if (r.ok) TREES[i] = await r.json(); }
    catch (e) {}
  }
  try { const r = await fetch("/props"); if (r.ok) PROPSTREE = await r.json(); }
  catch (e) {}
}

function treeCounts(d, isProps) {
  let dirs = 0, leaves = 0;
  const walk = t => {
    dirs += t.dirs.length;
    leaves += (isProps ? t.items : t.notes).length;
    t.dirs.forEach(walk);
  };
  if (d) walk(d);
  return { dirs, leaves };
}

function spawnStage(cx = 0.5, cy = 0.5) {
  // the default stage: EMPTY glass except THE RING (tap it and the
  // configured orbs bloom). The clap passes 0.5 — the ring
  // materializes center stage.
  items.forEach(killItem);
  const ring = makeRing();
  ring.x = innerWidth * cx; ring.y = innerHeight * cy;
  ring.scale = TUNE.menuScale;
  return ring;
}

// ---- THE BROWSER PANES (shelf v3): one pane per kind, an indented
// tree that unfolds in place. Rows = fat tap zones; pinch-drag =
// scroll (the panel machinery verbatim); hold-still = move; flash =
// close. The scatter-bloom system this replaced is gone.
function escT(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function browserRows(b) {
  const out = [];
  const walk = (d, path, depth, isProps) => {
    d.dirs.forEach(sub => {
      // the backgrounds folder is a backdrop library, not staging props
      if (isProps && sub.name === "backgrounds") return;
      const key = path + "/" + sub.name;
      const open = b.expanded.has(key);
      out.push({ d: depth, t: sub.name, k: "dir", o: open ? 1 : 0, key });
      if (open) walk(sub, key, depth + 1, isProps);
    });
    (isProps ? d.items : d.notes).forEach(x => {
      if (isProps) out.push({ d: depth, t: x.split("/").pop(), k: "prop", f: x });
      else out.push({ d: depth, t: x.title, k: "note", f: x.file });
    });
  };
  if (b.bkind === "shapes") {
    for (const k in SHAPES) {
      const on = items.some(i => i.type === "shape" && i.skind === k && i.el.isConnected);
      out.push({ d: 0, k: "shape", w: k,
                 t: `${SHAPES[k].title}${on ? "   \u00b7 on board" : ""}` });
    }
    return out;
  }
  if (b.bkind === "games") {
    for (const k in GAME_KINDS) {
      const on = items.some(i => i.type === "game" && i.gkind === k && i.el.isConnected);
      out.push({ d: 0, k: "game", w: k,
                 t: `${GAME_KINDS[k].title}${on ? "   \u00b7 playing" : ""}` });
    }
    return out;
  }
  if (b.bkind === "apps") {           // the Apps station lists widgets
    for (const k in WDG_KINDS) {
      const on = items.some(i => i.type === "wdg" && i.wkind === k && i.el.isConnected);
      out.push({ d: 0, k: "widget", w: k,
                 t: `${WDG_KINDS[k].title}${on ? "   · on board" : ""}` });
    }
    return out;
  }
  if (b.bkind === "props" && PROPSTREE) walk(PROPSTREE, "", 0, true);
  else if (typeof b.bkind === "number" && TREES[b.bkind])
    walk(TREES[b.bkind], "", 0, false);
  return out;
}

function browserRowsHTML(tuples) {
  const ICO = { dir0: "▸", dir1: "▾", note: "▤", prop: "▦",
                widget: "▣", game: "▶", shape: "◈" };
  return tuples.map(([d, t, k, o], i) =>
    `<div class="brow ${k}" data-i="${i}" style="padding-left:${18 + d * 26}px">` +
    `<span class="bico">${k === "dir" ? ICO["dir" + o] : ICO[k]}</span>` +
    `<span class="btxt">${escT(t)}</span></div>`).join("");
}

function browserRefresh(b) {
  b.rows = browserRows(b);
  b.rowTuples = b.rows.map(r => [r.d, r.t, r.k, r.o || 0]);
  b.rowsV = (b.rowsV || 0) + 1;
  b.body.innerHTML = browserRowsHTML(b.rowTuples);
  const box = b.body.parentElement.clientHeight;
  const maxS = Math.max(0, b.body.offsetHeight - box + 40);
  b.scrollY = Math.min(b.scrollY || 0, maxS);
  b.body.style.transform = `translateY(${-b.scrollY}px)`;
}

// THE PANE MUST NOT LAND ON THE RING. Growing it from the orb's spot is
// right and stays, but the orbs bloom about 330px out while this pane is
// 560 wide -- so centring on an orb reliably parks it ON the ring, hiding
// the very thing you tapped to get here and leaving no way back without
// dragging the pane off it first.
//
// So the pane is pushed along whichever side of the ring the orb was on,
// until its near edge clears the ring's own radius. Nearest clearing side
// wins, so it still grows in the direction you reached. If neither side
// can clear it -- a narrow window with the ring in the middle -- the
// roomier side is taken, which is the least bad of two bad options rather
// than a silent failure.
const BROWSER_HALF_W = 280;            // .panel.browser is 560 wide
const BROWSER_HALF_H = 360;            // ...and 720 tall
const RING_RADIUS = 220;               // the ring canvas is 440 square

function browserClampX(v) {
  return Math.min(Math.max(v, BROWSER_HALF_W + 20),
                  innerWidth - BROWSER_HALF_W - 20);
}

function browserX(ox) {
  let x = ox != null ? ox : innerWidth * 0.38;
  const ring = items.find(i => i.type === "widget" && i.def && i.def.w === "ring");
  if (ring) {
    const clear = RING_RADIUS * (ring.scale || 1) + BROWSER_HALF_W + 24;
    const left = browserClampX(ring.x - clear);
    const right = browserClampX(ring.x + clear);
    const ok = [left, right].filter(v => Math.abs(v - ring.x) >= clear);
    x = ok.length
      ? ok.reduce((a, b) => (Math.abs(b - x) < Math.abs(a - x) ? b : a))
      : (Math.abs(left - ring.x) > Math.abs(right - ring.x) ? left : right);
  }
  return browserClampX(x);
}

function browserY(oy) {
  const y = oy != null ? oy : innerHeight * 0.46;
  return Math.min(Math.max(y, BROWSER_HALF_H + 20),
                  innerHeight - BROWSER_HALF_H - 20);
}

function openBrowser(kind, ox, oy) {
  // TOGGLE: tap the orb (or summon) again = the pane recedes. Phase 2:
  // an orb tap passes its position so the pane GROWS FROM the orb's
  // spot (clamped fully onscreen) — the circle language never breaks.
  const ex = items.find(i => i.type === "browser" && i.bkind === kind);
  if (ex) { killItem(ex); return; }
  loadTree().then(() => {
    const label = String(kind === "props" ? "Props" : kind === "apps" ? "Widgets"
      : kind === "games" ? "Games" : kind === "shapes" ? "Projects"
      : ((CFG.orbs || [])[kind] || {}).title || "Notes").toUpperCase();
    const el = document.createElement("div");
    el.className = "panel browser";
    el.innerHTML = `<div class="bar"><h3>${escT(label)}</h3></div>` +
                   `<div class="body"><div class="scroll"></div></div>`;
    closable(el);
    BEHIND.appendChild(el);
    const b = { el, id: UID++, type: "browser", bkind: kind,
      def: { title: label, file: "" },
      expanded: new Set(), rows: [], rowTuples: [], rowsV: 0,
      x: browserX(ox), y: browserY(oy),
      scale: 1, vx: 0, vy: 0,
      grabbedBy: [], ox: 0, oy: 0, flying: false, stretch: null,
      scrollY: 0, body: el.querySelector(".scroll") };
    b.anim = { k: "in", t: 0 }; b.el.style.opacity = "0.05";
    items.push(b);
    browserRefresh(b);
  });
}

function flashRow(container, i) {
  const el = container && container.querySelector(`.brow[data-i="${i}"]`);
  if (!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;                  // restart the animation
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 700);
}

function browserTap(b, cur) {
  for (const rowEl of b.el.querySelectorAll(".brow")) {
    const r = rowEl.getBoundingClientRect();
    if (cur.y >= r.top && cur.y <= r.bottom &&
        cur.x >= r.left && cur.x <= r.right) {
      const row = b.rows[+rowEl.dataset.i];
      if (!row) return;
      // the tap flash: mark it for both pages (dir taps re-render the
      // rows, so the local flash applies AFTER the branch runs; the
      // tapped dir keeps its index — children insert below it)
      b.flashI = +rowEl.dataset.i;
      b.flashV = (b.flashV || 0) + 1;
      setTimeout(() => flashRow(b.body, b.flashI), 0);
      if (row.k === "dir") {
        if (b.expanded.has(row.key)) b.expanded.delete(row.key);
        else b.expanded.add(row.key);
        browserRefresh(b);
      } else if (row.k === "note") {
        openPanel({ def: { file: row.f, title: row.t } });
        killItem(b);   // v3.3 (his broadened rule): selecting ANYTHING
                       // closes the whole pane — only dir taps keep it
      } else if (row.k === "shape") {
        makeShape(row.w);
        browserRefresh(b);
      } else if (row.k === "game") {
        makeGame(row.w);
        browserRefresh(b);
      } else if (row.k === "widget") {
        wantWidget(row.w, b.x + 480 < innerWidth - 200 ? b.x + 440 : b.x - 440, b.y);
        browserRefresh(b);          // the row relabels; the pane stays up
      } else if (row.k === "prop") {
        const src = "/media/" + row.f;
        const it = isModelSrc(src) ? makeModel(src, row.t)
                                   : makeImage(src, row.t);
        it.x = Math.min(b.x + 480, innerWidth - 240); it.y = b.y;
        it.anim = { k: "in", t: 0 }; it.el.style.opacity = "0.05";
        items.push(it);
        killItem(b);   // v3.3: any selection closes the pane
      }
      return;
    }
  }
}

// minimal safe markdown-ish render: escape all HTML, then style headers/bold
function renderNote(text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.split("\n").map(l => {
    if (/^#{1,6} /.test(l)) return `<span class="h">${l.replace(/^#+ /, "")}</span>`;
    return l.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }).join("\n");
}

async function openPanel(card, literal) {
  if (items.some(i => i.type === "panel" && i.def === card.def)) return;
  if (items.some(i => i.type === "panel" &&
                      i.def.title && i.def.title === card.def.title)) return;
  let text = literal != null ? literal : "(couldn't load the note)";
  if (literal == null) {
    try {
      const r = await fetch("/note?f=" + encodeURIComponent(card.def.file));
      if (r.ok) text = await r.text();
    } catch (e) {}
  }
  const el = document.createElement("div");
  el.className = "panel";
  const ttl = card.def.file ? card.def.file.split("/").pop().replace(".md", "")
                            : (card.def.title || "NOTE");
  el.innerHTML = `<div class="bar"><h3>${escT(ttl)}</h3></div>` +
                 `<div class="body"><div class="scroll">${renderNote(text)}</div></div>`;
  closable(el);
  BEHIND.appendChild(el);
  const p = { el, id: UID++, type: "panel", def: card.def, x: innerWidth * 0.5,
              y: innerHeight * 0.44, scale: 1, vx: 0, vy: 0, grabbedBy: [],
              ox: 0, oy: 0, flying: false, stretch: null, scrollY: 0,
              body: el.querySelector(".scroll") };
  items.push(p);
}

function toast(msg, ms = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", ms);
}

// ---- camera selection: ?cam=<label substring> > saved choice > default.
// C cycles live. Multiple cameras are the RIG DESIGN: track on a second
// camera mounted at the main lens while OBS films with the first — no
// device contention, ever (Jared's multi-cam question, 2026-08-07).
let camDevices = [], camIdx = -1;

async function startCam(deviceId) {
  if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
  const IW = PORTRAIT ? Math.min(...RES) : Math.max(...RES);
  const IH = PORTRAIT ? Math.max(...RES) : Math.min(...RES);
  const video = { width: { ideal: IW }, height: { ideal: IH } };
  if (deviceId) video.deviceId = { exact: deviceId };
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  } catch (e) {
    // THE RESILIENT BOOT (2026-08-13 night — the tracking camera
    // powered down off the bus and the failed default request bricked
    // the ENTIRE stage boot): one dead camera must never kill the
    // show. Fall through every camera the OS still offers and take
    // the first that opens; only die if NONE do. C still cycles.
    const devs = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === "videoinput");
    for (const d of devs) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: d.deviceId },
                   width: { ideal: IW }, height: { ideal: IH } },
          audio: false });
        break;
      } catch (e2) {}
    }
    if (!stream) throw e;
  }
  cam.srcObject = stream;
  await new Promise(r => cam.onloadedmetadata = r);
  camDevices = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === "videoinput");
  const live = stream.getVideoTracks()[0];
  camIdx = camDevices.findIndex(d => d.label === live.label);
  toast(`camera: ${live.label || "default"}`);
}

async function pickInitialCam() {
  // permission first (labels are blank until granted), then re-pick by name
  await startCam(null);
  const want = Q.get("cam") || localStorage.getItem("stage-cam") || "";
  if (want) {
    const hit = camDevices.find(d =>
      d.label.toLowerCase().includes(want.toLowerCase()) || d.deviceId === want);
    if (hit && camDevices[camIdx] !== hit) await startCam(hit.deviceId);
  }
}

async function cycleCam() {
  if (camDevices.length < 2) { toast("only one camera found"); return; }
  const next = camDevices[(camIdx + 1) % camDevices.length];
  await startCam(next.deviceId);
  localStorage.setItem("stage-cam", next.deviceId);
  lastVideoTs = -1;
}

addEventListener("keydown", e => {
  // live respawn: re-read the notes AND props trees from disk before
  // redrawing — a freshly dropped file appears on a plain R press
  if (e.key === "r" || e.key === "R") loadTree().then(() => spawnStage());
  if (e.key === "d" || e.key === "D") dbg.style.display = dbg.style.display === "block" ? "none" : "block";
  if (e.key === "c" || e.key === "C") cycleCam();
  if (e.key === "h" || e.key === "H") HEAD.toggle();
  if (e.key >= "1" && e.key <= "5") setMode(+e.key - 1);
  if (e.key === "p" || e.key === "P") {
    SAMPLER = { until: performance.now() + 4000, r: [], h8: [], h12: [], h16: [], h20: [], s: [], a: [] };
    toast("OMNI sampler: hold the pose for 4 seconds…", 4000);
  }
});

function toScreen(lm) {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  return { x: ox + (1 - lm.x) * dw, y: oy + lm.y * dh };
}

let lastClearT = 0, lastResetT = 0;   // clear/reset cooldowns (wipe + clap)
const clap = { hist: [] };            // inter-hand distance samples (v3)

function getCursor(i) {
  if (!cursors[i]) {
    const el = document.createElement("div");
    el.className = "cursor";
    el.innerHTML = `<div class="dwell" style="--p:0"></div><div class="arrow"></div>`;
    document.body.appendChild(el);
    cursors[i] = { el, ring: el.querySelector(".dwell"), x: innerWidth / 2,
                   y: innerHeight / 2, pinched: false, history: [],
                   fx: makeEuro(), fy: makeEuro(), spanPx: SPAN_PX,
                   palmOpen: false, softOpen: false, lastOpenT: 0,
                   lastSoftT: 0, wipe: null,
                   pinchT: 0, ghost: false };
  }
  return cursors[i];
}

function dropCursor(i) {
  const cur = cursors[i];
  if (!cur) return;
  items.forEach(c => { const k = c.grabbedBy.indexOf(i); if (k >= 0) endGrab(c, i, cur); });
  cur.el.remove();
  delete cursors[i];
}

function hitTest(cur) {
  for (let i = items.length - 1; i >= 0; i--) {
    const c = items[i], r = c.el.getBoundingClientRect();
    const pad = spanU(TUNE.hitPad);   // was a flat 24px: a fixed pad is a
    // much bigger magnet on a small screen than a large one, and it is
    // what made the cursor grab things it merely passed near.
    if (cur.x > r.left - pad && cur.x < r.right + pad &&
        cur.y > r.top - pad && cur.y < r.bottom + pad) return c;
  }
  return null;
}

// v13: zoneOf died — POINTING scrolls (a different hand shape), so a
// pinch ANYWHERE on anything is always grab/move/flick. No intent lock,
// no zones, no direction juries. The conflict didn't get solved; it got
// dissolved (Jared's design).

// Cancelling an animation must SETTLE it, not abandon it. The
// materialize tween drives scale, opacity and a slight 3D turn-in, and
// only puts them back when it reaches the end -- so dropping it partway
// froze a pane at whatever it happened to be holding. Grab a pane while
// it is still blooming in and it stayed permanently skewed, half-scaled
// and semi-transparent, with nothing to undo it.
// ============================================================
// THE SYSTEM HAND
// ------------------------------------------------------------
// The right hand is the mouse. The left drives the OS around it, so the
// two never have to be told apart by what they are doing -- they are
// doing different jobs entirely.
//
//   open palm, held      the ring menu, in or out
//   thumb pinch, tapped  close the front window
//   two fingers, held    next input plane
//
// Every one is a HELD pose or a tap with a cooldown, never a state the
// hand can fall into by resting.
// ============================================================
function handArches(lms) {
  const W0 = lms[0];
  const d = (a, b) => Math.hypot(lms[a].x - lms[b].x, lms[a].y - lms[b].y);
  const fR = (t, m) => {
    const md = Math.hypot(lms[m].x - W0.x, lms[m].y - W0.y);
    return md > 0 ? Math.hypot(lms[t].x - W0.x, lms[t].y - W0.y) / md : 0;
  };
  const span = d(0, 9);
  return { f8: fR(8, 5), f12: fR(12, 9), f16: fR(16, 13), f20: fR(20, 17),
           gap: span > 0 ? d(4, 8) / span : 1 };
}

function frontWindow() {
  const CLOSABLE = ["panel", "browser", "card", "img", "model", "game", "shape"];
  for (let i = items.length - 1; i >= 0; i--) {
    const c = items[i];
    if (c.el.isConnected && CLOSABLE.includes(c.type)) return c;
  }
  return null;
}

function systemHand(cur, lms, now) {
  const a = handArches(lms);
  const A = TUNE.pointArch;
  const open = a.f8 > A && a.f12 > A && a.f16 > A && a.f20 > A;
  const two = a.f8 > A && a.f12 > A &&
              (Math.min(a.f8, a.f12) - (a.f16 + a.f20) / 2) > TUNE.pointContrast;
  if (!cur.sPinch) {
    cur.sBase = cur.sBase == null ? a.gap : cur.sBase * 0.97 + a.gap * 0.03;
  }
  const sb = cur.sBase == null ? 0.7 : Math.max(0.25, cur.sBase);
  const pinched = a.gap < sb * (cur.sPinch ? TUNE.pressOut : TUNE.pressFrac);
  const cool = k => now > (cur.sCool || 0);
  const fire = ms => { cur.sCool = now + ms; };

  // OPEN PALM, held: the menu
  if (open && !pinched) {
    cur.sOpenT = cur.sOpenT || now;
    if (now - cur.sOpenT > 400 && cool()) {
      const ring = items.find(i => i.type === "widget" &&
                                   i.def && i.def.w === "ring" && i.el.isConnected);
      if (ring) { ringToggle(ring); toast("menu", 900); }
      fire(1400);
    }
  } else cur.sOpenT = 0;

  // TWO FINGERS, held: the next input plane
  if (two && !open && !pinched) {
    cur.sTwoT = cur.sTwoT || now;
    if (now - cur.sTwoT > 600 && cool()) {
      let i = 0;
      try { i = +(localStorage.getItem("novros-mode") || 0); } catch {}
      const n = (i + 1) % MODES.length;
      setMode(n); toast(MODES[n].k, 1200);
      fire(1600);
    }
  } else cur.sTwoT = 0;

  // THUMB PINCH, tapped: close the front window
  if (pinched && !cur.sPinch) { cur.sPinch = true; cur.sPinchT = now; }
  else if (!pinched && cur.sPinch) {
    cur.sPinch = false;
    if (now - (cur.sPinchT || 0) < 550 && cool()) {
      const w = frontWindow();
      if (w) { killItem(w); toast("closed", 800); fire(700); }
    }
  }
  cur.sysDbg = `SYS ${open ? "OPEN" : two ? "TWO" : pinched ? "PINCH" : "-"}` +
               ` gap ${a.gap.toFixed(2)}`;
}

function settleAnim(c) {
  const a = c.anim;
  if (!a) return;
  c.anim = null;
  if (a.k === "in" || a.k === "give") {
    c.inS = 1;
    c.el.style.opacity = "";
    if (c.type !== "model") c.ry = 0;
  } else if (a.k === "hover") {
    c.hs = 1; c.hch = 0;
  }
}

function beginGrab(c, i, cur) {
  c.flying = false;
  settleAnim(c);                                     // a grab beats an animation
  c.grabbedBy.push(i);
  lastTouchedId = c.id;
  cur.grabT = performance.now();
  // FOLEY SCOPE (Jared's rule 2026-08-07): sound belongs to MOVING the
  // widgets — opened panels are silent territory (the scroll-thup disease)
  if (c.type !== "panel") foley.grab();
  c.el.classList.add("grabbed");
  BEHIND.appendChild(c.el);                   // bring to front
  if (c.grabbedBy.length === 1) {
    c.ox = c.x - cur.x; c.oy = c.y - cur.y;
    // v16 — JARED'S SPEC (design #7, his own): on a NOTE, pinch = SCROLL
    // by default (the day-one mechanics); holding the pinch ~2s roughly
    // still (80px tremor room, timer re-anchors on drift instead of
    // punishing) PROMOTES to move — the note glows and latches to the
    // hand. Cards move immediately as always.
    if (c.type === "orb") {
      // bloom orbs are pinned TAP targets (Phase 2): pinchable, a quick
      // release opens their pane, but they never move — transient furniture
      c.mode = "pinned";
      c.tapX = cur.x; c.tapY = cur.y;
    } else if (c.type === "panel" || c.type === "browser") {
      // v3.3/v3.8 (Jared: "I need a dedicated place I can grab...
      // make the same rules apply to notes"): THE GRIP BAR on notes
      // AND folder panes — pinch the title bar = immediate MOVE, no
      // scroll-hold wait; quick tap there = CLOSE (endGrab). Below
      // the bar = scroll (+ rows on folder panes).
      const barEl = c.el.querySelector(".bar");
      const barR = barEl && barEl.getBoundingClientRect();
      if (barR && cur.y >= barR.top && cur.y <= barR.bottom &&
          cur.x >= barR.left && cur.x <= barR.right) {
        c.mode = "move"; c.barGrab = true;
        c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      } else {
        c.mode = "scroll"; c.barGrab = false;
        c.scroll0 = c.scrollY || 0; c.grabY0 = cur.y;
        c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      }
      c.tapX = cur.x; c.tapY = cur.y;   // tap discrimination
    } else if (c.type === "model") {
      // Build 1.1 (Jared's field call 8/9: the 180×9px handle bar broke
      // the v9 no-small-targets law — 2px tall on a shelf mini). Pinch
      // = MOVE like any card; HOLD ~1s roughly still = latch into
      // SPIN-in-place (the note panel's promotion machinery, flipped).
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // v3.1: tap-close discrimination
    } else if (c.type === "widget") {
      // the ring: carried like a card; a quick tap blooms the orbs
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // ring-tap discrimination
    } else {
      // GLASS ERA: every movable item arms the hold-to-rotate timer
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // v3: card tap-open discrimination
    }
  } else if (c.grabbedBy.length === 2 && c.mode !== "pinned") {
    // v3 (Jared's ruling 2026-08-14): two hands = SCALE ONLY — the
    // twist-roll died with the vocabulary redesign ("leave 2 hands for
    // scaling"; one-hand latch owns all rotation)
    const a = cursors[c.grabbedBy[0]], b = cursors[c.grabbedBy[1]];
    c.stretch = { d0: Math.hypot(a.x - b.x, a.y - b.y), s0: c.scale };
    c.mode = "stretch";
  }
}

function endGrab(c, i, cur) {
  c.grabbedBy = c.grabbedBy.filter(k => k !== i);
  if (c.type === "wdg") setTimeout(saveWidgets, 40);
  if (c.grabbedBy.length === 1) {
    c.stretch = null;
    const rem = cursors[c.grabbedBy[0]];
    if (rem) { c.ox = c.x - rem.x; c.oy = c.y - rem.y; c.mode = "move";
               c.holdX = rem.x; c.holdY = rem.y;
               c.holdT = performance.now(); }
  }
  if (c.grabbedBy.length === 0) {
    c.el.classList.remove("grabbed");
    c.stretch = null;
    const h = cur.history;
    c.hch = 0;                          // hold-charge / movable glow ends
    // shelf v3: a quick, near-still release on a browser row = the TAP
    // (folders unfold, notes open, props stage, widgets summon)
    if (c.type === "browser" && c.mode === "scroll") {
      if (isTap(cur, c)) browserTap(c, cur);
    }
    // v3.3/v3.8: a quick tap on the GRIP BAR closes — notes and
    // folder panes alike
    if ((c.type === "browser" || c.type === "panel") && c.barGrab &&
        !cur.probKill) {
      if (isTap(cur, c)) killItem(c);
      c.barGrab = false;
    }
    // GESTURE v3 (2026-08-14, Jared's spec — "make it a single pinch"):
    // THE TAP OPENS — a quick, near-still release on a file-card
    // unfurls its note. Same tap idiom rows and widget buttons already
    // use; the double flash is dead.
    const pullFresh = performance.now() - (c.pullT || 0) < 800 ||
                      cur.probKill;
    if (c.type === "card" && c.def.file && !pullFresh) {
      if (isTap(cur, c)) openPanel(c);
    }
    // GESTURE v3.1 (2026-08-14, the crush is DEAD — "that is happening
    // too naturally"): THE TAP IS SYMMETRIC — tap opens closed things,
    // tap CLOSES open things. Quick near-still release on a note,
    // image, or hologram = it recedes. Widgets/rows/orbs keep their own
    // tap meanings; a fresh force-pull catch can't be tap-killed.
    // v3.8: notes close at the BAR only (matching folders) — a body
    // tap can't kill a note mid-read; images/models keep tap-anywhere
    if ((c.type === "img" || c.type === "model")
        && !pullFresh && !c.flying) {
      if (isTap(cur, c)) killItem(c);
    }
    // PHASE 2 quick-tap releases: the RING toggles its orbital bloom;
    // an ORB grows into its browser pane (same discrimination gate as
    // the browser-row tap: short grip, near-zero travel)
    {
      if (isTap(cur, c)) {
        if (c.type === "widget" && c.def.w === "ring" &&
            c.mode === "move") {
          const sc = RINGS.get(c.id);
          if (sc) sc.tapT = Date.now() / 1000;   // the ring's tap pulse
          ringToggle(c);
        } else if (c.type === "orb") {
          orbActivate(c);
        }
      }
    }
    let flung = false;
    // v19.1 (Jared's confirm): a fling needs a REAL grip. Motion blur
    // during a fast wave collapses the fingers into a phantom 1-3 frame
    // "pinch" that grabbed the note and released at wave velocity —
    // notes got yeeted off screen by a bare hand. Sub-120ms grips
    // release in place, no throw.
    const gripMs = performance.now() - (cur.grabT || 0);
    // stretch releases NEVER fling (Jared's catch 8/8: "it keeps
    // throwing it off the screen" — a two-hand rip ends with fast hand
    // motion, which read as a flick and yeeted the freshly-enlarged
    // prop). Any item stretched in the last 700ms sets down gently;
    // only a deliberate one-hand flick can throw.
    if (h.length >= 2 && gripMs >= 120 &&
        performance.now() - (c.stretchT || 0) > 700) {
      // v3.6 (the dead toss): endpoint velocity sampled the throw's
      // follow-through — use PEAK velocity across the last ~200ms
      // instead. Guard: the FINAL instant must still carry ≥40% of the
      // peak, so a fast drag that STOPS before release places gently.
      const tEnd = h[h.length - 1].t;
      let vx = 0, vy = 0, pk = 0;
      for (let k = 0; k + 1 < h.length; k++) {
        const a2 = h[k], b2 = h[Math.min(k + 2, h.length - 1)];
        if (a2.t < tEnd - 220 || b2.t <= a2.t) continue;
        const d2 = (b2.t - a2.t) / 1000;
        const x2 = (b2.x - a2.x) / d2, y2 = (b2.y - a2.y) / d2;
        const s2 = Math.hypot(x2, y2);
        if (s2 > pk) { pk = s2; vx = x2; vy = y2; }
      }
      const la = h[Math.max(0, h.length - 3)], lb = h[h.length - 1];
      const ldt = (lb.t - la.t) / 1000;
      const lastS = ldt > 0
        ? Math.hypot(lb.x - la.x, lb.y - la.y) / ldt : 0;
      // v3.9.16 (his correction: "I also like tossing things between
      // both hands back and forth" — the v3.9.14 exit-bound rule
      // killed mid-screen tosses and died within the hour; 1800 was
      // too sticky besides): the intent-teller is FOLLOW-THROUGH — a
      // real throw carries its speed INTO the release (≥50% of peak),
      // a drag's echoes have decayed by then. Speed bar at 1500,
      // thrown anywhere he likes — including hand to hand.
      {
        if (pk > spanU(TUNE.flingSpan) && lastS > pk * 0.4) {   // v3.9.25: throw bar eased
          // v16: on a note in SCROLL mode only a clearly HORIZONTAL fling
          // closes (vertical fast releases are just energetic scrolling);
          // in promoted MOVE mode (and on cards) any fling tosses it.
          // (the v15 page-turn was removed — Jared rejected it.)
          // Build 1: a rotate-release NEVER flings the hologram — the
          // energy became spin momentum during the drag instead.
          if ((c.type === "model" && c.mode === "rotate") ||
              (c.type === "widget" && c.mode !== "move") ||
              c.mode === "pinned") {
            /* spin, not toss / taps, slides + pinned furniture never fling */
          } else if ((c.type !== "panel" && c.type !== "browser") ||
              c.mode !== "scroll" ||
              Math.abs(vx) > Math.abs(vy) * 1.2) {
            c.vx = vx; c.vy = vy; c.flying = true; flung = true;
          }
        }
      }
    }
    // foley: cards/images only (panels silent), and quick taps don't thup
    if (c.type !== "panel") {
      if (flung) foley.throw_();
      else if (performance.now() - (cur.grabT || 0) > 250) foley.place();
    }
  }
}

function killItem(c) {
  // graceful exit: recede into the screen (scale down + fade), then die —
  // the z-axis illusion (Jared's ask, v10). Replaces every instant remove.
  if (!c.el.isConnected || (c.anim && c.anim.k === "out")) return;
  c.grabbedBy = [];
  c.el.classList.remove("grabbed");
  c.flying = false;
  c.anim = { k: "out", t: 0 };
}

function physics(dt) {
  items = items.filter(c => c.el.isConnected || c.flying);
  // THE ORBITAL CONSTRAINT (round 5, Jared's law: the orbs keep a
  // CONSTANT clearance from the ring's EDGE wherever it is and
  // whatever size it is — satellites, riding moves + stretches live)
  const sun = items.find(i => i.type === "widget" &&
                              i.def.w === "ring" && i.el.isConnected);
  items.forEach(o => {
    if (o.type !== "orb" || !o.el.isConnected) return;
    if (!sun) { killItem(o); return; }       // no ring, no bloom
    const R = orbitR(sun.scale || 1, o.scale || 1);   // rim + gap + orb
    const tx = Math.min(innerWidth - 90, Math.max(90,
      sun.x + o.def.side * Math.cos(o.def.ang) * R));
    const ty = Math.min(innerHeight - 90, Math.max(90,
      sun.y + Math.sin(o.def.ang) * R));
    const k = Math.min(1, dt * 10);
    o.x += (tx - o.x) * k; o.y += (ty - o.y) * k;
  });
  // the spotlight ends itself: a grab or the item leaving the board
  if (presented && (!presented.el.isConnected || presented.grabbedBy.length))
    endPresent();
  items.forEach(c => {
    if (c.anim) {                     // the assistant's agency animations
      const a = c.anim; a.t += dt;
      if (a.k === "in") {             // THE MATERIALIZE (GLASS ERA):
        // born in place — back-ease bloom + a slight 3D turn-in,
        // the sci-fi materialize (replaces every edge-throw delivery)
        const p = Math.min(Math.max((a.t - (a.d || 0)) / 0.5, 0), 1);
        const c1 = 1.30158, c3 = c1 + 1;
        const e = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        c.inS = 0.5 + 0.5 * e;
        if (c.type !== "model") c.ry = -0.35 * (1 - e);
        c.el.style.opacity = String(0.05 + 0.95 * p);
        if (p >= 1) { c.anim = null; c.inS = 1; c.el.style.opacity = "";
                      if (c.type !== "model") c.ry = 0; }
      } else if (a.k === "out") {     // pushed OUT: recede + fade, then gone
        const p = Math.min(a.t / 0.35, 1);
        c.inS = 1 - 0.7 * p * p;
        c.el.style.opacity = String(1 - p);
        if (p >= 1) { c.el.remove(); c.anim = null; }
      } else if (a.k === "yank") {    // grip-fight shake, then ripped away
        if (a.t < 0.18) {
          c.jx = (Math.random() - 0.5) * 14; c.jy = (Math.random() - 0.5) * 14;
        } else {
          c.jx = c.jy = 0;
          c.x -= 2800 * dt;
          c.el.style.opacity = String(Math.max(0, 1 - (a.t - 0.18) / 0.45));
          if (c.x < -500) { c.el.remove(); c.anim = null; }
        }
      } else if (a.k === "hover") {   // attention pulse
        c.hch = 0.45 + 0.35 * Math.sin(a.t * 10);
        c.hs = 1 + 0.05 * Math.sin(a.t * 6);
        if (a.t > 2.2) { c.anim = null; c.hs = 1; c.hch = 0; }
      } else if (a.k === "present") { // THE PRESENT: fly to center stage
        const p = Math.min(a.t / 0.45, 1);   // and grow into the spotlight
        const e = 1 - Math.pow(1 - p, 3);
        c.x = a.x0 + (innerWidth * 0.5 - a.x0) * e;
        c.y = a.y0 + (innerHeight * 0.44 - a.y0) * e;
        c.scale = a.s0 + (a.s1 - a.s0) * e;
        c.el.style.opacity = "";
        if (p >= 1) c.anim = null;    // the spotlight classes hold until endPresent
      } else if (a.k === "give") {    // bloom in, then hand off to the
        const p = Math.min(a.t / 0.3, 1);            // pull flight — the
        const e = 1 - Math.pow(1 - p, 3);            // delivered-INTO-
        c.inS = 0.5 + 0.5 * e;                       // the-hand verb
        c.el.style.opacity = String(0.05 + 0.95 * p);
        if (c.type !== "model") c.ry = -0.35 * (1 - e);
        if (p >= 1) {
          if (c.type !== "model") c.ry = 0;
          c.el.style.opacity = "1";
          c.anim = cursors[a.ci]     // hand gone mid-bloom = stay at
            ? { k: "pull", t: 0, x0: c.x, y0: c.y, ci: a.ci }
            : null;                  // the reach (the offer fallback)
        }
      } else if (a.k === "pull") {    // THE FORCE PULL flight — ease-in
        const p = Math.min(a.t / 0.32, 1);
        const e = p * p;              // accelerates: ripped, not floated
        const cc = cursors[a.ci];
        const tx = cc ? cc.x : a.x0, ty = cc ? cc.y : a.y0;
        const ddx = tx - a.x0, ddy = ty - a.y0;
        const dd = Math.hypot(ddx, ddy) || 1;
        // a slight arc that dies at the hand
        const bow = Math.sin(Math.PI * p) * Math.min(90, dd * 0.12);
        c.x = a.x0 + ddx * e - (ddy / dd) * bow;
        c.y = a.y0 + ddy * e + (ddx / dd) * bow;
        if (p >= 1) {
          c.anim = null;
          const cc2 = cursors[a.ci];
          if (cc2) {                  // SMACK — caught, and HELD
            c.grabbedBy = [a.ci];
            c.pullT = performance.now();   // v3.1: tap guards skip a fresh catch
            c.mode = "move"; c.ox = 0; c.oy = 0;
            c.holdX = cc2.x; c.holdY = cc2.y;
            c.holdT = performance.now();
            cc2.grabT = performance.now();
            c.el.classList.add("grabbed");
            BEHIND.appendChild(c.el);
          }
          c.hch = 0;
        }
      } else if (a.k === "snap") {    // panel glides home after a page turn
        const p = Math.min(a.t / 0.3, 1), e = 1 - Math.pow(1 - p, 3);
        c.x = a.x0 + (a.x1 - a.x0) * e; c.y = a.y0 + (a.y1 - a.y0) * e;
        if (p >= 1) c.anim = null;
      }
    }
    if (c.sTarget != null && c.body) {  // smooth page glide
      c.scrollY = (c.scrollY || 0) + (c.sTarget - c.scrollY) * Math.min(1, dt * 8);
      if (Math.abs(c.sTarget - c.scrollY) < 1) { c.scrollY = c.sTarget; c.sTarget = null; }
      c.body.style.transform = `translateY(${-c.scrollY}px)`;
    }
    if (c.flying) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.vx *= 0.98; c.vy *= 0.98;
      if (c.x < -600 || c.x > innerWidth + 600 ||
          c.y < -600 || c.y > innerHeight + 600) {
        c.el.style.opacity = "0"; c.flying = false;
        if (c.type !== "panel") foley.void_();
        setTimeout(() => c.el.remove(), 300);
      }
    }
    // ROTATION EASING: a drag sets a TARGET and the item travels to it,
    // rather than being nailed to the raw pointer delta. Same total
    // travel, but the motion has weight and a stray jitter no longer
    // shows up one-for-one in the object.
    if (c.trot) {
      const rk = 1 - Math.exp(-dt / Math.max(0.008, TUNE.rotSmooth));
      c.rx = (c.rx || 0) + (c.trot.x - (c.rx || 0)) * rk;
      c.ry = (c.ry || 0) + (c.trot.y - (c.ry || 0)) * rk;
      c.rz = (c.rz || 0) + (c.trot.z - (c.rz || 0)) * rk;
    }
    // the model's idle drift must not fight a rotation in progress
    if (c.type === "model" && !c.trot && !(c.grabbedBy.length &&
        (c.mode === "rotate" || c.mode === "stretch"))) {
      // Build 1: spin momentum decays toward the stately idle turn —
      // a hologram that sits dead-still reads as a picture. (1.3: the
      // idle pauses during the gimbal grip too — it was creeping the
      // yaw while Jared held a precise two-hand pose.)
      c.rvy = (c.rvy || 0) * Math.pow(0.15, dt);
      c.ry = (c.ry || 0) + ((c.rvy || 0) + 0.12) * dt;
    }
    c.el.style.setProperty("--ch", c.hch || 0);   // hover charge glow
    const w = c.el.offsetWidth, h = c.el.offsetHeight;
    // GLASS ERA: items pose in real 3D (models rotate INSIDE their
    // three.js scene — their el stays flat, no double-spin)
    const r3 = c.type !== "model" && (c.rx || c.ry || c.rz)
      ? ` rotateX(${c.rx || 0}rad) rotateY(${c.ry || 0}rad) rotateZ(${c.rz || 0}rad)`
      : "";
    c.el.style.transform =
      `translate(${c.x - w / 2 + (c.jx || 0)}px, ${c.y - h / 2 + (c.jy || 0)}px)` +
      r3 + ` scale(${c.scale * (c.hs || 1) * (c.inS || 1)})`;
  });
}

async function boot() {

    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");

    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU" },
    numHands: 2, runningMode: "VIDEO",
    // phantom-hand filter (a real-room catch: debug showed a hand with
    // none in frame — a busy background is full of hand-shaped clutter
    // and the 0.5 defaults hallucinate there; a ghost hand can grab items
    // and false-trigger gestures). 0.65 helped but the ghost
    // survived → 0.7. Ease back toward 0.65 if real-hand pickup ever
    // feels laggy; past 0.75 real tracking suffers.
    minHandDetectionConfidence: 0.7,

    // and re-acquisition eats the frames that felt like grab-lag):
    // KEEP-tracking eased to 0.5 so a latched hand rides through blur;
    // fresh DETECTION stays 0.7 — the busy-background ghost wall holds.

  await loadTree();
  spawnStage();
  restoreWidgets();
  BG.restore();
  let lastT = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (cam.currentTime !== lastVideoTs) {
      lastVideoTs = cam.currentTime;
      const res = landmarker.detectForVideo(cam, now);
      if (HEAD.on) HEAD.update(now);
      if (BG.on) BG.render(now);
      const seen = new Set();
      (INPUT.hand ? (res.landmarks || []) : []).forEach((lms, i) => {
        seen.add(i);
        const cur = getCursor(i);
        const tip = toScreen(lms[8]), thumb = toScreen(lms[4]);
        const span = Math.hypot(lms[0].x - lms[9].x, lms[0].y - lms[9].y);

        // only listens to prayer-vertical hands (Jared's rule)

        // onto the display. Every distance gate is a multiple of this, so
        // it tracks both screen size and how far away the hand is.

        let isLeft = hcat ? hcat.categoryName === "Left" : false;
        if (TUNE.swapHands) isLeft = !isLeft;
        cur.isLeft = isLeft;
        cur.el.classList.toggle("sys", isLeft && TUNE.systemHand);
        if (isLeft && TUNE.systemHand) {
          cur.x = cur.fx(tip.x, now); cur.y = cur.fy(tip.y, now);

          systemHand(cur, lms, now);

        }

        const px = (tip.x + thumb.x) / 2, py = (tip.y + thumb.y) / 2;

        const _cy = cur.ptActive ? tip.y : py;

        const extArr = [[8, 5], [12, 9], [16, 13], [20, 17]].map(([t, m]) =>
          Math.hypot(lms[t].x - W0.x, lms[t].y - W0.y) >

        // v3.8.2 — THE CONTRAST LAW (6 correct / 6 impostor corpus;

        // range, ending absolute-height gating): the OK-sign's true
        // signature is index-vs-the-rest CONTRAST — the index curls IN
        // to the thumb while middle/ring/pinky stay out. Arch delta
        // (backMean − f8) ≥ 0.28 in every correct sample, ≤ 0.07 in
        // every impostor incl. both near-pinches. Cut at 0.18, with a
        // 1.30 back-arch floor as the fist wall. The EMA sustained
        // read stays — lucky frames still buy nothing.

        const f12v = fR(12, 9), f16v = fR(16, 13), f20v = fR(20, 17);

        // v3.8.4 — TWO ORIENTATION REGIMES (his profiled-pinch sample:
        // aspect 1.63 / thumb-dist 1.18 vs 2.1-5.5 / 0.4-0.7 in ALL
        // frontal samples — a rotated palm compresses the arch ratios
        // and the contrast law's numbers don't transfer). The regime
        // self-announces via palm aspect; in PROFILE the thumb is the
        // judge — a profile pinch rides it far off the knuckle row
        // (1.16+), every fist ever sampled wraps it tight (≤0.72).

                                 lms[5].y - lms[17].y);

        const tRel = span > 0 ? Math.hypot(
          lms[4].x - lms[13].x, lms[4].y - lms[13].y) / span : 0;

        // signature admits — contrast (frontal) OR far-thumb (profile).
        // Every correct sample passes at least one; every impostor
        // sampled passes neither.

                       (aspect < 2.0 && tRel > TUNE.profileTRel);
        // v3.8.3 (his tap report: drag fixed, tap still flaky) — the
        // EMA charged too slow for a snap-tap (~6 frames): rate up to

        // pinch should activate") — instant path: TWO consecutive
        // clean frames (this one + the last, 33ms — the camera's own

        // hands whose approach was messy. Single lucky frames still
        // buy nothing.

        cur.okPrev = okBack;
        // v3.9.8 (his mid-drag fling report: fast dragging smears the
        // fingers, the gap falsely inflates past the release bar for a
        // frame, and the phantom release fires at drag velocity = a

        // further; any future "pinch not taking" is signature or

        // corpus, opposite sign -- so the two poses are mutually

        // pinch-grab that seizes whatever it touches. Relaxing your
        // fingers mid-pinch was enough to flip it. That switching
        // underneath you is what made everything feel like a coin toss.

        // than like the arrow having failed

        // test above -- so a held press starved the grace window and the
        // pointer lapsed mid-drag. The drag does not even begin until
        // pointTapMs (420ms) and the grace ran out at 520ms, which left

        // the hand is still pointing; it is simply pressing as well.
        else if ((cur.ptBent || cur.ptDrag) &&

          // depends on the person, the camera angle and the distance, so

          // number. Instead track how straight THIS finger has been over
          // the last moment (ptPeak) and call a press a proportional drop
          // away from it -- the same measure-the-hand-against-itself rule
          // the rest of the gates use.

          // the index itself bending. Whichever your hand does first.
          // THE GAP IS RELATIVE TO YOUR OWN OPEN HAND. A fixed
          // threshold cannot work: seen from the side, the thumb-index
          // gap is foreshortened, so a resting pointing hand can already
          // read below any number chosen from a front-on camera -- and
          // then the button is simply always down, which is why a window

          // adopts a new maximum instantly and decays at 1% a frame, so
          // it sits at the top of the tracker's jitter. Release wanted
          // f8v to climb back above 0.92 x that peak -- and ordinary
          // jitter is wider than 8%, so the press could re-trigger on
          // noise every few frames and never let go. That is why windows
          // kept dragging with no way to stop them.
          //
          // The thumb is the button. It is one measurement, it reads at
          // any angle, and it releases the instant the thumb opens.
          const bendIn = TUNE.pressBend && (cur.ptBent
            ? f8v < recBar : (f8v < dipBar || f8v < TUNE.pointDip));
          const bent = thumbIn || bendIn;

          // as you like: if the pointer never travelled, it is a click.
          // The old rule gave you 420ms to press and release or it
          // counted as a drag, which is why a deliberate pinch over the
          // X dragged the window instead of closing it.
          if (bent && !cur.ptBent) {                   // button DOWN
            cur.ptBent = true; cur.ptDipT = now;
            cur.downX = cur.x; cur.downY = cur.y;      // where you aimed
            cur.dragged = false;
            cur.dwT = 0; cur.dwCool = now + 400;
          } else if (!bent && cur.ptBent) {            // button UP
            cur.ptBent = false;
            if (!cur.dragged) pointActivate(cur.downX, cur.downY, cur);
          }

          // arrow on something and it fires on its own, with the ring
          // charging at the tip so it can never feel like an accident.

            // nothing no matter what it passes over; the moment it comes

            // never has to be long enough to be safe.

            if (hh1.length >= 3) {

              if (dt1 > 0) vNow = Math.hypot(b1.x - a1.x, b1.y - a1.y) / dt1;

            const travelling = vNow > spanU(TUNE.dwellMoveBar);

            // move again before anything else can, which is what stops a
            // freshly-opened pane firing the row that lands under a
            // resting hand.
            if (travelling) cur.dwArm = true;
            const tgt = hitTest(cur);
            if (tgt && !travelling && cur.dwArm) {
              if (!cur.dwT || cur.dwTgt !== tgt) { cur.dwT = now; cur.dwTgt = tgt; }
              const prog = Math.min(1, (now - cur.dwT) / TUNE.dwellMs);
              if (cur.ring) cur.ring.style.setProperty("--p", prog.toFixed(3));
              if (prog >= 1) {
                cur.dwT = 0; cur.dwTgt = null; cur.dwArm = false;
                cur.dwCool = now + TUNE.dwellCoolMs;
                if (cur.ring) cur.ring.style.setProperty("--p", "0");
                pointSingle(cur);
              }
            } else {
              cur.dwT = 0; cur.dwTgt = null;
              if (cur.ring) cur.ring.style.setProperty("--p", "0");
            }

          // A quick bend-and-release is a click; KEEPING the finger bent
          // past that same window is a button held down, so the thing
          // under the arrow comes with you until you straighten again.
          // This is how you move an open window: press on it anywhere
          // and go. No need to find the title bar, and no pinch, which
          // is the part that does not survive an off-axis camera.
          if (cur.ptBent && !cur.ptDrag && !cur.dragged &&
              Math.hypot(cur.x - (cur.downX ?? cur.x),
                         cur.y - (cur.downY ?? cur.y)) > spanU(TUNE.dragStart)) {
            cur.dragged = true;
            const tgt = hitTest({ x: cur.downX, y: cur.downY });
            if (tgt && tgt.grabbedBy.length === 0) {
              beginGrab(tgt, i, cur);

              // grab into scroll: dragging a window should move the
              // window. Scrolling stays on the body's own pinch-drag.
              if (tgt.mode !== "pinned") {
                tgt.mode = "move";
                tgt.ox = tgt.x - cur.x; tgt.oy = tgt.y - cur.y;
                tgt.holdX = cur.x; tgt.holdY = cur.y;
                tgt.holdT = now; tgt.hch = 0.6;
              }
              cur.ptDrag = tgt;
            } else cur.ptDrag = tgt ? null : "none";
          }
          // A FLAT PALM ALWAYS LETS GO. Whatever the button logic
          // thinks, an open hand means put it down -- so there is always
          // a way out that needs no reading of thresholds.
          if (cur.ptDrag && f12v > TUNE.pointArch && f16v > TUNE.pointArch) {
            if (cur.ptDrag !== "none") endGrab(cur.ptDrag, i, cur);
            cur.ptDrag = null; cur.ptBent = false;
          }
