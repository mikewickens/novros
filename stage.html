<html>
<head>
<meta charset="utf-8">
<title>barehands</title>
<style>
:root {
  --c0: 0,229,255;
  --c2: 2,10,10;
  --c3: 2,14,12;
  --c4: 3,18,16;
  --c5: 3,33,29;
  --c6: 4,25,28;
  --c7: 4,26,24;
  --c8: 5,34,39;
  --c9: 10,40,36;
  --c10: 14,40,36;
  --c11: 16,44,40;
  --c12: 18,48,44;
  --c13: 18,60,54;
  --c14: 20,72,79;
  --c15: 30,70,64;
  --c16: 52,108,100;
  --c17: 58,116,108;
  --c18: 60,120,112;
  --c19: 70,140,130;
  --c20: 107,156,150;
  --c21: 111,227,201;
  --c22: 111,229,214;
  --c23: 127,179,171;
  --c24: 140,225,212;
  --c25: 140,240,225;
  --c26: 143,240,228;
  --c27: 150,255,236;
  --c28: 159,240,221;
  --c29: 160,240,226;
  --c30: 160,255,240;
  --c31: 168,216,207;
  --c32: 180,255,245;
  --c33: 191,255,245;
  --c34: 200,245,236;
  --c35: 210,255,248;
  --c36: 220,245,238;
  --c37: 223,243,238;
  --c38: 228,250,252;
  --c39: 230,255,240;
  --c40: 234,255,251;
  --c41: 235,250,250;
  --c42: 236,255,250;
}

  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
               background:#000; font-family:-apple-system,"SF Pro Display",sans-serif; }
  body.overlay { background:transparent; }
  body.keybg { /* background color set by JS from ?key= (default magenta) */ }
  /* green-key fallback: the UI can't be green on a green key (learned live
     2026-08-07 — the cursor got keyed out of existence). Cyan takes over. */
  body.ui-cyan .cursor { border-color:rgba(var(--c0),0.9); background:rgba(var(--c0),0.12); }
  body.ui-cyan .cursor.pinched { background:rgba(var(--c0),0.85); box-shadow:0 0 18px rgba(var(--c0),0.8); }
  body.ui-cyan .cursor .dwell { background:conic-gradient(rgb(var(--c0)) calc(var(--p)*360deg), transparent 0); }
  body.ui-cyan .card, body.ui-cyan .panel { border-color:rgba(var(--c0),0.5); }
  body.ui-cyan .card h3, body.ui-cyan .panel .bar h3, body.ui-cyan .panel .close
    { color:rgb(var(--c0)); border-color:rgba(var(--c0),0.6); }
  body.ui-cyan .scroll .h { color:rgb(var(--c0)); }
  #toast { position:absolute; top:14px; right:14px; z-index:998; display:none;
           background:rgba(0,0,0,0.7); color:rgb(var(--c26)); padding:8px 14px;
           border-radius:8px; font:13px "SF Mono",Menlo,monospace; }
  /* the squeeze-hold charge glow, visible on the TRACKER too (the render
     page has its own on-air rule): pinch + hold still = charge = open/close */
  .card, .panel { --ch:0; }
  body:not(.on-air) .card.grabbed, body:not(.on-air) .panel.grabbed {
    box-shadow:0 12px 60px rgba(0,0,0,0.7),
      0 0 calc(44px + var(--ch)*70px) rgba(var(--c22),calc(0.35 + var(--ch)*0.55)); }
  /* THE PRESENT spotlight: one item center stage, the rest step back */
  .dimmed { opacity:0.22 !important; filter:saturate(0.35);
    transition:opacity 0.35s, filter 0.35s; }
  .presented { box-shadow:0 16px 70px rgba(0,0,0,0.65),
      0 0 70px rgba(var(--c22),0.45); }
  /* ON-AIR (the OBS render page): backdrop-blur has nothing to sample
     in the compositor. GLASS ERA: the near-solid slabs died (Jared's
     8/13 call — "frankly more transparent") — true translucent glass,
     readability carried by the halo text-shadows below. */
  body.on-air .panel { background:linear-gradient(160deg, rgba(var(--c17),0.42), rgba(var(--c11),0.34)); backdrop-filter:none; }
  body.on-air .card  { background:linear-gradient(160deg, rgba(var(--c18),0.38), rgba(var(--c12),0.30)); backdrop-filter:none; }
  body.on-air .card p, body.on-air .panel .scroll {
    text-shadow:0 1px 3px rgba(var(--c3),0.95), 0 0 10px rgba(var(--c3),0.85); }
  body.on-air .card h3, body.on-air .panel .bar h3 {
    text-shadow:0 1px 3px rgba(var(--c3),0.95), 0 0 14px rgba(var(--c22),0.55); }
  /* the dwell CHARGE glow — the card announces it's about to open (the
     audience's cue once the cursor rings are hidden) */
  body.on-air .card, body.on-air .panel { --ch:0;
    box-shadow:0 8px 40px rgba(0,0,0,0.55),
      0 0 calc(24px + var(--ch)*70px) rgba(var(--c22),calc(0.10 + var(--ch)*0.75)),
      inset 0 1px 0 rgba(var(--c33),0.35); }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
         transform:scaleX(-1); }
  body.overlay #cam, body.keybg #cam {
         width:2px; height:2px; opacity:0.01; pointer-events:none; }
  /* THE GLASS ERA (2026-08-13, Jared's redesign): clean CLEAR glass —
     low-alpha smoked fills you genuinely see through, one luminous
     edge, a specular kiss on top. No wireframe chrome; restraint IS
     the aesthetic. Readability rides halo text, not slab fills. */
  .card { position:absolute; width:480px; padding:22px 24px; border-radius:16px;
          background:linear-gradient(168deg, rgba(var(--c19),0.30), rgba(var(--c12),0.18));
          border:1.5px solid rgba(var(--c25),0.55);
          box-shadow:0 10px 44px rgba(0,0,0,0.40), 0 0 26px rgba(var(--c22),0.14),
                     inset 0 1px 0 rgba(var(--c35),0.55),
                     inset 0 -14px 30px rgba(var(--c22),0.05);
          color:rgb(var(--c42)); user-select:none; will-change:transform;
          transform-origin:center center; }
  body.keybg .card, body.keybg .panel { backdrop-filter:none;
          background:rgba(var(--c15),0.97); }
  .card h3 { margin:0 0 8px; font-size:19px; letter-spacing:0.08em; color:rgb(var(--c26));
             font-family:"SF Mono",Menlo,monospace; text-transform:uppercase; }
  /* THE RING (naked canvas, the modelcard pattern) + THE ORBITAL
     BLOOM orbs: the ring is the hub — tap it and your configured
     folders bloom around it as glass orbs. */
  .card.ringcard { width:440px; padding:0; background:transparent;
                   border:none; box-shadow:none; backdrop-filter:none; }
  .card.ringcard canvas { display:block; width:440px; height:440px;
                          pointer-events:none; }
  body:not(.on-air) .card.ringcard, .card.ringcard.grabbed,
  body.on-air .card.ringcard {
      box-shadow:none; border:none; background:transparent; }
  .card.ringcard.grabbed canvas {
      filter:brightness(calc(1.12 + var(--ch,0)*0.3)); }
  body.on-air .card.ringcard.grabbed canvas { filter:none; }
  .card.orb { width:150px; height:150px; border-radius:50%; padding:0;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; gap:2px; }
  .card.orb h3 { margin:0; font-size:16px; }
  .card.orb p { font-size:11.5px; color:rgb(var(--c31)); margin:0; }
  .card.imgcard { padding:6px; width:auto; overflow:hidden;
      border-color:rgba(var(--c22),0.5);
      box-shadow:0 8px 40px rgba(0,0,0,0.55), 0 0 30px rgba(var(--c22),0.20),
                 inset 0 1px 0 rgba(var(--c33),0.35); }
  .card.imgcard img { display:block; max-width:32vw; max-height:44vh;
                      border-radius:10px; pointer-events:none; }
  /* MATERIALIZE-AS-LIGHT (Jared's call 8/9): images ARRIVE as hologram
     — teal monochrome light + one scan sweep — then resolve to their
     TRUE colors. Theater at the edges, truth in the content (evidence
     stays evidence; the folder law's spirit for pixels). */
  .card.imgcard img, .card.imgcard video { transition:filter 0.5s ease-out; }
  .card.imgcard.mat img, .card.imgcard.mat video {
      filter:brightness(1.55) saturate(0.2) sepia(1) hue-rotate(115deg)
             saturate(2.4) drop-shadow(0 0 22px rgba(var(--c22),0.85)); }
  .card.imgcard.mat::after { content:""; position:absolute; left:0; right:0;
      height:16%; top:-20%; background:linear-gradient(180deg, transparent,
      rgba(var(--c33),0.75), transparent);
      animation:matscan 0.6s linear; pointer-events:none; }
  @keyframes matscan { from { top:-20%; } to { top:110%; } }
  /* THE FX LAYER (2026-08-08, Jared's idea: "throw me a fireball") —
     anything in media/fx/ (or any .webm) renders NAKED: no chip, no
     border, no shadow — a floating OBJECT with full physics. Alpha
     PNGs float; alpha WebMs loop silently. */
  .card.fxcard { padding:0; background:transparent; border:none;
                 box-shadow:none; backdrop-filter:none; }
  .card.fxcard img, .card.fxcard video { display:block; max-width:36vw;
                 max-height:52vh; border-radius:0; pointer-events:none; }
  /* kill EVERY rectangular glow layer on fx, both pages — the tracker's
     grab-glow and the render's always-on air-glow both paint box-shadows
     at higher specificity than the base fx class (the fireball's green
     halo+frame bug, Jared's catch 8/8). The object's own alpha
     silhouette carries the grab cue via drop-shadow instead. */
  body:not(.on-air) .card.fxcard, body:not(.on-air) .card.fxcard.grabbed,
  body.on-air .card.fxcard, .card.fxcard.grabbed {
      box-shadow:none; border:none; background:transparent; }
  /* grab cue: the object FLARES in the hand (brightness+saturation) —
     drop-shadow was the "green shadow behind it" bug: generated flames
     carry a wide semi-alpha haze and the shadow glows through all of it.
     On-air: no cue at all — bare-hands invisible magic. */
  .card.fxcard.grabbed,
  body:not(.on-air) .card.fxcard.grabbed {
      filter:brightness(1.18) saturate(1.2); }
  body.on-air .card.fxcard.grabbed { filter:none; }
  /* BUILD 1 — 3D HOLOGRAMS (2026-08-09, gestures at 1.4): a model
     renders NAKED like fx — transparent WebGL canvas, ZERO chrome (the
     1.1 handle-bar zone died to the no-small-targets law; the base bar
     killed at 1.3, Jared's call). Pinch = move; hold-still latches
     spin — the charge cue is the MODEL brightening via --ch; two hands
     = carry + twist-roll + scale (the 1.3 gimbal was rejected, one
     round). Folder = render law: holo/ = blue wire, else solid. Fixed
     480px both pages (the v20.4 law: identical geometry = 1:1). */
  .card.modelcard { padding:0; background:transparent; border:none;
                    box-shadow:none; backdrop-filter:none; width:480px; }
  .card.modelcard canvas { display:block; width:480px; height:480px;
                    pointer-events:none; }
  /* (the v1 holo CSS drop-shadow retired at 2.0 — the ghost-glass
     shader + its bloom rig carry the glow now) */
  body:not(.on-air) .card.modelcard, body:not(.on-air) .card.modelcard.grabbed,
  body.on-air .card.modelcard, .card.modelcard.grabbed {
      box-shadow:none; border:none; background:transparent; }
  .card.modelcard.grabbed canvas {
      filter:brightness(calc(1.18 + var(--ch,0)*0.4)) saturate(1.15); }
  /* ON-AIR: no grab/charge cue on models — the fx precedent (bare-hands
     invisible magic; the tracker stays Jared's confidence monitor). */
  body.on-air .card.modelcard.grabbed canvas { filter:none; }
  /* THE BROWSER PANES: tap an orb = a tall glass pane with an
     indented file tree; folders unfold IN PLACE; rows are fat tap
     zones. */
  .panel.browser { width:560px; height:720px; }
  .brow { display:flex; align-items:center; gap:12px; min-height:68px;
          border-bottom:1px solid rgba(var(--c22),0.12); font-size:18px; }
  .brow .bico { color:rgb(var(--c26)); width:28px; text-align:center; flex:none;
                font-size:20px; }
  .brow.dir .btxt { color:rgb(var(--c26)); font-weight:600; letter-spacing:0.02em; }
  .brow.note .btxt, .brow.prop .btxt, .brow.widget .btxt { color:rgb(var(--c42)); }
  .brow .btxt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* THE TAP FLASH (2026-08-13, the mirror-doctrine softener): the row
     you tap pulses full-width on BOTH pages. Rows span the pane and
     vertical never mirrors, so the pulse sits directly under the
     on-air fingertip even though horizontal touch offsets flip
     (the mirror doctrine). Also plain good feedback. */
  .brow.flash { animation:rowflash 0.6s ease-out; }
  @keyframes rowflash {
    from { background:rgba(var(--c25),0.4); }
    to   { background:transparent; } }
  .card p  { margin:0; font-size:17px; line-height:1.45; color:rgb(var(--c36)); text-shadow:0 1px 3px rgba(var(--c4),0.55); }
  .card p:empty { display:none; }
  .card.grabbed, .panel.grabbed { border-color:rgb(var(--c26));
          box-shadow:0 12px 60px rgba(0,0,0,0.7), 0 0 44px rgba(var(--c22),0.35); }
  /* v20.4: FIXED px (the 44vw×70vh of a 1920×1080 OBS canvas) so tracker
     and render wrap text identically — same content height on both sides
     makes the fractional scroll a true 1:1 (hand speed = on-air speed) */
  .panel { position:absolute; width:845px; height:756px; border-radius:18px;
           background:linear-gradient(172deg, rgba(var(--c16),0.36), rgba(var(--c10),0.24));
           border:1.5px solid rgba(var(--c25),0.6); color:rgb(var(--c42));
           box-shadow:0 16px 70px rgba(0,0,0,0.5), 0 0 50px rgba(var(--c22),0.16),
                      inset 0 1px 0 rgba(var(--c35),0.55);
           display:flex; flex-direction:column; will-change:transform; }
  .panel .bar { padding:42px 16px; border-bottom:1px solid rgba(var(--c22),0.3);   /* v3.8: THE GRIP BAR everywhere — notes + folders (grab = move, tap = close) */
                display:flex; justify-content:space-between; align-items:center; }
  .panel .bar h3 { margin:0; font-size:14px; color:rgb(var(--c26)); letter-spacing:0.08em;
                   font-family:"SF Mono",Menlo,monospace; text-transform:uppercase; }
  .panel .close { width:30px; height:30px; border-radius:50%; text-align:center;
                  line-height:28px; border:1.5px solid rgba(var(--c22),0.65);
                  color:rgb(var(--c26)); font-size:15px; }
  .panel .body { flex:1; overflow:hidden; padding:14px 20px; }
  .panel .scroll { transition:none; font-size:14.5px; line-height:1.5; color:rgb(var(--c36)); text-shadow:0 1px 3px rgba(var(--c4),0.55);
                   white-space:pre-wrap; font-family:-apple-system,sans-serif; }
  .panel .scroll b { color:#fff; } .panel .scroll .h { color:rgb(var(--c26)); font-weight:700; }
  /* NOVROS: the resize corner announces itself on hover, so the grip is
     discoverable instead of being a secret 26px square. */
  .card.gripping::after, .panel.gripping::after {
    content:""; position:absolute; right:4px; bottom:4px; width:17px; height:17px;
    border-right:2.5px solid rgba(var(--c27),0.95);
    border-bottom:2.5px solid rgba(var(--c27),0.95);
    border-bottom-right-radius:5px; pointer-events:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
  /* ---------- NOVROS WIDGETS ---------- */
  .card.wdg { width:auto; padding:0; border-radius:22px; overflow:hidden;
              background:linear-gradient(165deg, rgba(var(--c30),0.34), rgba(var(--c5),0.26));
              border:1.5px solid rgba(var(--c33),0.42);
              box-shadow:0 14px 48px rgba(0,0,0,0.45), 0 0 30px rgba(var(--c33),0.14); }
  .card.wdg .win { padding:18px 20px; }
  .wdg .wlbl { font:600 10.5px "SF Mono",Menlo,monospace; letter-spacing:0.16em;
               color:rgba(var(--c39),0.72); text-transform:uppercase; }
  .wdg .wbig { font:300 62px -apple-system,"SF Pro Display",sans-serif; line-height:1;
               color:rgb(var(--c41)); letter-spacing:-0.02em;
               text-shadow:0 2px 14px rgba(0,0,0,0.5); }
  .wdg .wmid { font:600 17px -apple-system,sans-serif; color:rgba(var(--c41),0.95); }
  .wdg .wsm  { font:500 12.5px -apple-system,sans-serif; color:rgba(var(--c39),0.8); }
  .wdg .strip { display:flex; gap:14px; margin-top:14px; padding-top:13px;
                border-top:1px solid rgba(var(--c33),0.22); }
  .wdg .strip div { text-align:center; flex:1; }
  .wdg .strip .h { font:600 11px "SF Mono",Menlo,monospace;
                   color:rgba(var(--c39),0.62); }
  .wdg .strip .t { font:600 14px -apple-system,sans-serif;
                   color:rgba(var(--c41),0.94); margin-top:5px; }
  .wdg canvas { display:block; }
  .card.wdg.clockw, .card.wdg.datew { width:200px; }
  .card.wdg.weatherw { width:362px; }
  .wdg .dnum { font:200 78px -apple-system,"SF Pro Display",sans-serif; line-height:0.92;
               color:rgb(var(--c41)); letter-spacing:-0.04em; }
  .wdg .dday { font:700 21px -apple-system,sans-serif; color:rgb(var(--c33)); }
  .wdg .dmon { font:700 21px -apple-system,sans-serif; color:rgba(var(--c39),0.85); }
  .cursor { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px;
            border-radius:50%; border:2.5px solid rgba(var(--c22),0.9);
            background:rgba(var(--c22),0.12); pointer-events:none; z-index:999; }
  .cursor.pinched { background:rgba(var(--c22),0.85); transform:scale(0.62);
                    box-shadow:0 0 18px rgba(var(--c22),0.8); }
  /* NOVROS POINTER: index-finger pointing turns the ring into a real
     OS arrow, anchored at its tip so the point sits on your fingertip. */
  .cursor .arrow { position:absolute; left:-2px; top:-2px; width:23px; height:31px;
                   display:none; background:rgba(var(--c27),0.97);
                   clip-path:polygon(0 0, 0 76%, 25% 58%, 43% 97%, 62% 89%, 45% 52%, 77% 49%);
                   filter:drop-shadow(0 2px 5px rgba(0,0,0,0.75)); }
  .cursor.pointing { background:none; border:none; box-shadow:none; transform:none; }
  .cursor.pointing .arrow { display:block; }
  /* the dwell ring becomes the hover-to-click charge, drawn around the
     arrow's tip so the feedback sits exactly where you are aiming */
  .cursor.pointing .dwell { display:block; inset:-12px; opacity:0.9; }
  .cursor.clicking .arrow { background:#ffffff; transform:scale(0.86); }
  .cursor .dwell { position:absolute; inset:-7px; border-radius:50%;
                   background:conic-gradient(rgb(var(--c26)) calc(var(--p)*360deg), transparent 0);
                   -webkit-mask:radial-gradient(circle, transparent 58%, black 60%);
                   opacity:0.95; }
  #hint { position:absolute; bottom:14px; left:0; right:0; text-align:center;
          color:rgba(var(--c39),0.7); font-size:13.5px; z-index:998;
          text-shadow:0 1px 6px rgba(0,0,0,0.8); }
  body.overlay #hint, body.greenkey #hint { display:none; }
  #debug { position:absolute; top:12px; left:12px; z-index:998; display:none;
           background:rgba(0,0,0,0.65); color:rgb(var(--c26)); padding:10px 12px;
           border-radius:8px; font:12px "SF Mono",Menlo,monospace; white-space:pre; }
  /* GLASS ERA: the item layer is a real 3D SPACE — every card, panel,
     and widget can rotate in Z (hold-latch); default pose is flat.
     (The 8/11 depth-mask person-segmenter that masked this layer was
     fully removed 2026-08-13 — the line was killed 8/11 but its
     tracker half survived the baseline; Jared field-caught it.) */
  #behind { position:fixed; inset:0; z-index:1; perspective:1200px; }
  /* (an earlier whole-screen voice-pulse border was removed —
     THE RING is the assistant's presence now.) */
  /* ---------- NOVROS INTRO ---------- */
  #intro { position:fixed; inset:0; z-index:2000; display:flex; flex-direction:column;
           align-items:center; justify-content:center; pointer-events:none;
           background:radial-gradient(ellipse at center, rgba(var(--c7),0.82) 0%, rgba(var(--c2),0.96) 70%);
           opacity:1; transition:opacity 0.9s ease; }
  #intro.gone { opacity:0; }
  #intro .rings { position:absolute; width:min(74vmin,620px); height:min(74vmin,620px);
                  border-radius:50%; border:1.5px solid rgba(var(--c22),0.35);
                  animation:introPulse 2.6s cubic-bezier(.16,.8,.3,1) forwards; }
  #intro .rings:nth-child(2) { animation-delay:0.18s; }
  #intro .rings:nth-child(3) { animation-delay:0.36s; }
  @keyframes introPulse { 0% { transform:scale(0.18); opacity:0; }
                          35% { opacity:0.85; } 100% { transform:scale(1.25); opacity:0; } }
  #intro .wel { font:600 clamp(11px,1.5vmin,15px) "SF Mono",Menlo,monospace;
                letter-spacing:0.62em; color:rgba(var(--c29),0.9); margin-bottom:22px;
                opacity:0; animation:introUp 0.9s ease 0.35s forwards; text-indent:0.62em; }
  #intro .nov { display:flex; gap:clamp(4px,1.1vmin,12px); }
  #intro .nov span { font:700 clamp(34px,10vmin,104px) "SF Mono",Menlo,monospace;
                     color:rgb(var(--c40)); opacity:0; transform:translateY(0.32em) scale(0.82);
                     text-shadow:0 0 34px rgba(var(--c22),0.75), 0 2px 10px rgba(0,0,0,0.8);
                     animation:introChar 0.72s cubic-bezier(.16,1.1,.3,1) forwards; }
  #intro .sweep { position:absolute; width:min(90vmin,760px); height:2px;
                  background:linear-gradient(90deg, transparent, rgba(var(--c30),0.95), transparent);
                  opacity:0; animation:introSweep 1.5s ease 0.5s forwards; }
  #intro .sub { margin-top:26px; font:500 clamp(9px,1.25vmin,13px) "SF Mono",Menlo,monospace;
                letter-spacing:0.38em; color:rgba(var(--c24),0.72); opacity:0;

// ------------------------------------------------------------
// Every interaction gate below used to be a RAW SCREEN PIXEL number,
// fitted on a single 1920x1080 window with a front-facing camera.
// Two consequences, both reported from the field:
//   1. On a bigger/denser display the same physical hand motion covers
//      more pixels, so taps exceed their travel budget and become drags,
//      and ordinary moves exceed the fling bar and fly off screen.
//   2. With the camera OFF TO THE SIDE the hand sits in the "profile"
//      regime, where the pinch gate is at its loosest -- so the cursor
//      grabs things in passing, and the wide release band makes the
//      bogus grab stick.
// These gates are now expressed as multiples of SPAN: the hand's own
// wrist-to-middle-knuckle length, measured in screen pixels. That is
// the same "measure the hand against itself" philosophy the claw and
// pinch shape-gates already use, extended to the distance gates, so it
// holds at any display size and any camera distance.
//

// on the very next frame. No reload, no restart.
// ============================================================
const TUNE = {

  tapMs:         340,    // max grip duration that still counts as a tap
  tapTravel:     0.34,   // xSPAN  cursor drift allowed inside a tap
  // --- grab ---
  hitPad:        0.10,   // xSPAN  hit-target inflation around every item
  // --- pinch ---
  releaseBar:    0.46,   // pinch ratio at which a slow hand lets go (was 0.55)
  releaseFast:   0.62,   // ... at which a fast hand lets go        (was 0.70)
  fastHandSpan:  6.7,    // SPAN/s  what counts as a "fast" hand    (was 800px/s)
  profileTRel:   1.05,   // profile-lane thumb-off-knuckle floor    (was 0.95)
  // --- rotate ---
  autoRotate:    false,  // hold-still-to-3D-rotate auto-latch. DEFAULT OFF:
                         // it was firing uninvited on whatever a stray pinch
                         // happened to be holding. Set true to restore.
  rotateStill:   0.38,   // xSPAN  stillness that keeps the latch armed
  // --- scroll -> move promotion ---
  scrollStill:   0.68,   // xSPAN  stillness that keeps that timer armed
  // --- throw ---
  flingSpan:    11.0,    // SPAN/s  fling speed bar (was a flat 1300 px/s)
  // --- pointing (index-finger pointer + tap-to-click) ---
  pointContrast: 0.18,   // index arch MINUS back-three arch: the exact
                         // mirror of the pinch's CONTRAST LAW, so the two
                         // poses can never be confused with each other
  pointArch:     1.30,   // index must genuinely reach out past its knuckle
  pointDip:      1.12,   // absolute bend floor (kept as a second chance)
  pointDipFrac:  0.82,   // THE REAL TEST: a press is a RELATIVE drop from

                         // works for a small press and for any hand
  pointRecFrac:  0.92,   // ... and it must come back up past this to fire
  dwellClick:    true,   // hover-to-click: the guaranteed way in
  dwellMs:       140,    // rest-to-fire delay once the hand has STOPPED.

                         // it is the stopping (see dwellMoveBar).
  dwellMoveBar:  1.8,    // SPAN/s  above this the hand is TRAVELLING, and a

  dwellCoolMs:   450,    // pause after a dwell fires

  headGain:      3.4,    // screen travel per unit of head turn
  headDeadzone:  0.012,  // ignore turns smaller than this, so a still

  headSmooth:    1.0,    // One Euro min-cutoff for the head cursor
  blinkScore:    0.5,    // eye-closed confidence from the face model
  blinkOpenMax:  0.25,   // ... and what counts as definitely OPEN
  blinkMinMs:    190,    // shorter than this is an INVOLUNTARY blink and
                         // is ignored -- natural blinks run 100-150ms
  blinkMaxMs:   1300,    // longer than this is resting, not a click
  doubleBlinkMs: 620,    // two deliberate blinks inside this = double
  winkMs:        260,    // one eye held shut = pick up / put down
  winkDrag:      true,

  scrollGain:    1.6,    // content travel per unit of hand travel
  twoFingerScroll: true, // index + middle out = scroll, like a trackpad
  pointGraceMs:  520,    // pointer stays engaged through a click's dip
  pointTapMs:    420,    // max duration of the bend that counts as a click
  doubleMs:      420,    // two clicks inside this = a double click

  euroMinCutoff: 1.2,    // lower  = smoother while the hand is still
  euroBeta:      0.030,  // higher = more responsive while it moves

// The live hand span in screen px, smoothed. Seeded with a sane value so
// the gates behave before the first hand is ever seen.
let SPAN_PX = 120;
const spanU = m => m * SPAN_PX;     // span-relative -> screen pixels

// ---- ONE EURO FILTER -------------------------------------------------
// Replaces the old fixed `cur.x += (px - cur.x) * 0.45` EMA, which was
// simultaneously too laggy for a snap-tap and too jittery to hold still,
// and whose real strength drifted with framerate (it ran once per CAMERA
// frame, so at 15fps it barely smoothed at all). One Euro adapts: heavy
// smoothing when the hand is nearly still -- which is exactly when a
// tap's travel budget needs protecting -- and light smoothing when it
// moves, so drags stay responsive. Standard Casiez/Roussel/Vogel filter.
function makeEuro() {
  let xPrev = null, dxPrev = 0, tPrev = 0;
  const alpha = (cutoff, dt) => {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  };
  return function (x, t) {
    if (xPrev === null) { xPrev = x; tPrev = t; return x; }
    let dt = (t - tPrev) / 1000;
    if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
    tPrev = t;
    const dx = (x - xPrev) / dt;
    dxPrev = dxPrev + alpha(TUNE.euroDCutoff, dt) * (dx - dxPrev);
    const cutoff = TUNE.euroMinCutoff + TUNE.euroBeta * Math.abs(dxPrev);
    xPrev = xPrev + alpha(cutoff, dt) * (x - xPrev);
    return xPrev;
  };
}

function isTap(cur, c) {

  // pointer travelled. Without this both paths fired, so every mouse
  // click ran its action twice -- which is why a folder row appeared
  // dead: browserTap expanded it and then immediately collapsed it.
  if (cur.isMouse) return false;
  const ms = performance.now() - (cur.grabT || 0);
  const trav = Math.hypot(cur.x - (c.tapX ?? cur.x), cur.y - (c.tapY ?? cur.y));
  return ms < TUNE.tapMs && trav < spanU(TUNE.tapTravel);
}

// ---- FOLEY (2026-08-07): synthesized WebAudio — the objects make SOUND,
// which is what makes invisible cards feel physical. Plays from the
// TRACKER page through Mac audio, captured by the existing stream rig.
// Chrome arms audio on the first user gesture (any key/click).
// foley ships OFF by default (a field call: the sounds read as noise
// on camera). The engine stays; &sound=1 turns it on.
const SOUND = Q.get("sound") === "1";

function _ac() {
  if (!AC) { try { AC = new (window.AudioContext || webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume().catch(() => {});
  return AC;
}

function _noise(dur, fLo, fHi, gain, sweepTo) {
  if (!SOUND) return;
  const ac = _ac(); if (!ac || ac.state !== "running") return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime((fLo + fHi) / 2, ac.currentTime);
  if (sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, ac.currentTime + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(); src.stop(ac.currentTime + dur);
}

  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);

  g.gain.setValueAtTime(gain, t0);

// ring: concentric glass rings, tick ring, wordmark core. BOTH pages
// animate it LOCALLY from /orb (the assistant's state files) on
// wall-clock phases — tracker and overlay pulse as one; only

// listening (deep blue, pulses draw INWARD — blue = the human
// talking) · thinking (radar sweep) · speaking (the live waveform
// drives glow/thickness/core through an auto-gain). Moods tint the
// whole ring red/amber.
const RING = {
  data: { state: "idle", mood: "green", wave: null }, amp: 0, gmax: 1,
  live: 0,
  // palette eyedropped from the design reference (exact reference
  // colors, SUBTLE state shifts — a deep-blue listening state was

  COLS: { idle: [140, 235, 240], listening: [120, 205, 250],

setInterval(async () => {

function ringAmp() {
  // the preserved aura pulse math: RMS+peak blend, auto-gain against a
  // rolling ceiling, contrast-expanded, fast attack / musical decay
  const d = RING.data;
  let target = 0;
  if (d.state === "speaking" && d.wave && d.wave.length) {
    let s = 0, pk = 0;
    for (const v of d.wave) { s += v * v; pk = Math.max(pk, Math.abs(v)); }
    const raw = 0.6 * Math.sqrt(s / d.wave.length) + 0.4 * pk;
    RING.gmax = Math.max(raw, (RING.gmax || 1) * 0.995);
    target = Math.pow(Math.min(1, raw / Math.max(3, RING.gmax)), 2.2);
  }
  RING.amp += (target - RING.amp) * (target > RING.amp ? 0.6 : 0.2);
  return RING.amp;
}
