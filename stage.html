    const ty = innerHeight / 2 + dy * TUNE.headGain * innerHeight;
    cur.x = this.fx(Math.max(4, Math.min(innerWidth - 4, tx)), now);
    cur.y = this.fy(Math.max(4, Math.min(innerHeight - 4, ty)), now);
    cur.el.style.left = cur.x + "px"; cur.el.style.top = cur.y + "px";
    if (this.held) {                           // carrying something
      this.held.x = cur.x + (this.held.ox || 0);
      this.held.y = cur.y + (this.held.oy || 0);
    }

    // ---- the eyes ----
    const bs = r.faceBlendshapes && r.faceBlendshapes[0];
    if (!bs) return;
    let bL = 0, bR = 0;
    for (const c of bs.categories) {
      if (c.categoryName === "eyeBlinkLeft") bL = c.score;
      else if (c.categoryName === "eyeBlinkRight") bR = c.score;
    }
    const both = bL > TUNE.blinkScore && bR > TUNE.blinkScore;
    const winkL = bL > TUNE.blinkScore && bR < TUNE.blinkOpenMax;
    const winkR = bR > TUNE.blinkScore && bL < TUNE.blinkOpenMax;
    const wink = winkL || winkR;

    if (TUNE.winkDrag && wink) {
      if (!this.winkT) { this.winkT = now; this.winkSide = winkL ? 1 : 2; }
      else if (now - this.winkT > TUNE.winkMs && this.winkSide) {
        this.winkSide = 0;                          // fires once per wink
        if (this.held) { endGrab(this.held, HEAD_ID, cur); this.held = null; }
        else {
          const t = hitTest(cur);
          if (t && t.grabbedBy.length === 0) {
            beginGrab(t, HEAD_ID, cur);
            if (t.mode !== "pinned") {
              t.mode = "move"; t.ox = t.x - cur.x; t.oy = t.y - cur.y;
              t.holdX = cur.x; t.holdY = cur.y; t.holdT = now; t.hch = 0.6;
            }
            this.held = t;
          }
        }
      }
    } else if (!wink) this.winkT = 0;

    // A deliberate blink is one you MEAN: an involuntary blink is over in
    // 100-150ms, so anything shorter than blinkMinMs is thrown away and
    // the board never fires while you are simply looking at it.
    if (both && !this.closedT) this.closedT = now;
    else if (!both && this.closedT) {
      const heldMs = now - this.closedT; this.closedT = 0;
      if (heldMs >= TUNE.blinkMinMs && heldMs <= TUNE.blinkMaxMs) this.click(cur);
    }
    this.dbg = `head yaw ${dx.toFixed(3)} pitch ${dy.toFixed(3)}` +
               ` eyes ${bL.toFixed(2)}/${bR.toFixed(2)}` +
               `${both ? " BLINK" : wink ? " WINK" : ""}` +
               `${this.held ? " CARRYING" : ""}`;
  },
};

const MOUSE_ID = 99;
// The corner zone that means "resize". Scaled off the item's RENDERED
// size, because a flat 26px square is most of a shrunken prop and an
// invisible speck on one stretched to fill the screen.
function gripSize(r) {
  return Math.max(18, Math.min(46, Math.min(r.width, r.height) * 0.16));
}
let mDrag = null;                // the active mouse interaction
let gripEl = null;               // element currently showing its corner handle

function mouseCursor(x, y) {
  const cur = getCursor(MOUSE_ID);
  cur.isMouse = true;
  cur.el.style.display = "none";  // the OS pointer is the visible cursor
  cur.x = x; cur.y = y;
  return cur;
}
// A corner grip, in the item's own screen rect.
function inGrip(c, x, y) {
  if (c.type === "orb" || c.type === "widget") return false;
  const r = c.el.getBoundingClientRect();
  const g = gripSize(r);
  return x > r.right - g && x < r.right + 10 &&
         y > r.bottom - g && y < r.bottom + 10;
}
// Scale about the item's centre, clamped to the same range two-hand
// stretch uses, so hand and mouse cannot disagree about the limits.
function setScale(c, s) {
  c.scale = Math.min(12, Math.max(0.12, s));
}
function scrollBy(c, dy) {
  if (!c.body || !c.body.parentElement) return false;
  const box = c.body.parentElement.clientHeight;
  const maxS = Math.max(0, c.body.offsetHeight - box + 40);
  if (maxS <= 0) return false;
  c.scrollY = Math.min(maxS, Math.max(0, (c.scrollY || 0) + dy));
  c.body.style.transform = `translateY(${-c.scrollY}px)`;
  return true;
}
// The click outcome, mirroring what a hand TAP does to each item type.
function mouseTap(c, cur) {
  if (!c.el || !c.el.isConnected) return;
  if (c.type === "browser") return browserTap(c, cur);
  if (c.type === "orb")     return orbActivate(c);
  if (c.type === "widget" && c.def.w === "ring") {
    const sc = RINGS.get(c.id);
    if (sc) sc.tapT = Date.now() / 1000;
    return ringToggle(c);
  }
  if (c.type === "card" && c.def.file) return openPanel(c);
  if (c.type === "img" || c.type === "model" || c.type === "wdg") return killItem(c);
  if (c.type === "panel") {                       // notes close at the bar
    const barEl = c.el.querySelector(".bar");
    const r = barEl && barEl.getBoundingClientRect();
    if (r && cur.y >= r.top && cur.y <= r.bottom) killItem(c);
  }
}

addEventListener("contextmenu", e => { if (mDrag || hitTest({ x: e.clientX, y: e.clientY })) e.preventDefault(); });

addEventListener("mousedown", e => {
  if (!INPUT.mouse) return;
  const x = e.clientX, y = e.clientY;
  const c = hitTest({ x, y });
  if (!c) return;
  e.preventDefault();
  const cur = mouseCursor(x, y);
  cur.grabT = performance.now();

  if (e.button === 2) {                                   // RIGHT = rotate
    mDrag = { c, cur, kind: "rotate", x0: x, y0: y,
              r0x: c.rx || 0, r0y: c.ry || 0, t: performance.now() };
    c.el.classList.add("grabbed");
    return;
  }
  if (e.button !== 0) return;

  if (inGrip(c, x, y)) {                                  // CORNER = resize
    const d0 = Math.hypot(x - c.x, y - c.y) || 1;
    mDrag = { c, cur, kind: "resize", d0, s0: c.scale || 1 };
    c.el.classList.add("grabbed");
    return;
  }
  beginGrab(c, MOUSE_ID, cur);            // LEFT = the ordinary grab
  c.tapX = x; c.tapY = y;
  mDrag = { c, cur, kind: "grab", x0: x, y0: y, moved: false };
});

addEventListener("mousemove", e => {
  if (!INPUT.mouse) return;
  const x = e.clientX, y = e.clientY;
  if (!mDrag) {                            // idle: hint what the corner does
    const c = hitTest({ x, y });
    const onGrip = !!c && inGrip(c, x, y);
    if (gripEl && gripEl !== (c && c.el)) gripEl.classList.remove("gripping");
    gripEl = onGrip ? c.el : null;
    if (gripEl) gripEl.classList.add("gripping");
    document.body.style.cursor = onGrip ? "nwse-resize" : c ? "grab" : "";
    return;
  }
  const { c, cur } = mDrag;
  cur.x = x; cur.y = y;

  if (mDrag.kind === "rotate") {
    const ROT = 0.012;
    let ny = mDrag.r0y + (x - mDrag.x0) * ROT;
    if (c.type !== "model") ny = Math.max(-1.2, Math.min(1.2, ny));
    c.ry = ny;
    c.rx = Math.max(-1.2, Math.min(1.2, mDrag.r0x + (y - mDrag.y0) * ROT));
    return;
  }
  if (mDrag.kind === "resize") {
    const d = Math.hypot(x - c.x, y - c.y);
    setScale(c, mDrag.s0 * (d / mDrag.d0));
    return;
  }
  // grab: the first real movement converts a note's scroll-grab into a
  // move, because with a mouse the WHEEL is what scrolls.
  if (Math.hypot(x - mDrag.x0, y - mDrag.y0) > 4) {
    if (!mDrag.moved) {
      mDrag.moved = true;
      if (c.mode === "scroll") { c.mode = "move"; c.ox = c.x - x; c.oy = c.y - y; }
    }
    if (c.mode === "move") { c.x = x + (c.ox || 0); c.y = y + (c.oy || 0); }
  }
});

addEventListener("mouseup", e => {
  if (!INPUT.mouse) return;
  if (!mDrag) return;
  const { c, cur, kind } = mDrag;
  const x = e.clientX, y = e.clientY;
  cur.x = x; cur.y = y;
  document.body.style.cursor = "";

  if (kind === "rotate") {
    c.el.classList.remove("grabbed");
    // a right-click that never travelled flattens the item back out
    if (Math.hypot(x - mDrag.x0, y - mDrag.y0) < 4 &&
        performance.now() - mDrag.t < 300) { c.rx = 0; c.ry = 0; c.rvy = 0; }
  } else if (kind === "resize") {
    c.el.classList.remove("grabbed");
    c.el.classList.remove("gripping"); gripEl = null;
    if (c.type === "wdg") saveWidgets();
  } else {
    const click = !mDrag.moved;
    endGrab(c, MOUSE_ID, cur);
    if (click) mouseTap(c, cur);
    if (c.type === "wdg") saveWidgets();
  }
  mDrag = null;
});

addEventListener("wheel", e => {
  if (!INPUT.mouse) return;
  const c = hitTest({ x: e.clientX, y: e.clientY });
  if (!c) return;
  e.preventDefault();
  // Scroll it if it HAS anything to scroll -- a note, a folder pane --
  // and otherwise resize it. A hologram or an image has no scroll, and
  // the wheel is the first thing a hand reaches for to size one.
  if (!e.shiftKey && scrollBy(c, e.deltaY)) return;
  setScale(c, (c.scale || 1) * (e.deltaY > 0 ? 0.92 : 1.08));
}, { passive: false });

if (ROLE === "render") {
  document.body.classList.add("overlay");
  document.body.classList.add("on-air");
  if (SS > 1) document.body.style.zoom = SS;   // the 2x render raster
  // the html element ALSO paints #000 behind the body — OBS composites
  // whatever the page actually draws (the "still black" bug, 2026-08-07)
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
  document.getElementById("boot").remove();
  const h = document.getElementById("hint");
  if (h) h.remove();
  renderLoop();
} else {
  THEME.restore();     // theme and chrome belong to the PAGE, so they come
  buildModes();        // up immediately rather than waiting on a camera
  runIntro();
  boot().catch(e => {
    document.getElementById("boot").innerHTML =
      `STAGE FAILED TO BOOT<br><span style="color:#ff6666;font-size:13px">${e.message}</span>`;
  });
}
</script>
</body>
</html>
